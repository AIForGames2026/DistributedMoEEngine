name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine (zig build test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install liburing and libibverbs
        run: sudo apt-get update && sudo apt-get install -y liburing-dev libibverbs-dev
      - name: Unit tests (x86_64)
        run: zig build test --summary all
      - name: io_uring reader test
        run: zig build io-test --summary all
      - name: Run
        run: zig build run
      - name: Start-to-first-kernel time (< 5 ms)
        run: zig build startup -Doptimize=ReleaseFast
      - name: Dispatch check (shared memory and TCP loopback)
        run: |
          zig build install -Doptimize=ReleaseFast
          zig-out/bin/dispatch shm
          zig-out/bin/dispatch expert --port 7470 & expert=$!
          zig-out/bin/dispatch router --host 127.0.0.1 --port 7470
          wait $expert
      - name: Two-process MoE vs PyTorch goldens (PoC check)
        run: |
          zig-out/bin/dispatch shm --moe
          zig-out/bin/dispatch expert --port 7471 --moe & expert=$!
          zig-out/bin/dispatch router --host 127.0.0.1 --port 7471 --moe
          wait $expert
      - name: Expert loader on the fixtures (TASK-08, io_uring O_DIRECT)
        run: |
          zig build tfload -Doptimize=ReleaseFast
          t="$RUNNER_TEMP/tfload"
          mkdir -p "$t" && cp tests/golden/quant_tiny.* tests/golden/nvfp4_tiny.* "$t"/
          zig-out/bin/tfload index "$t/quant_tiny.gguf"
          zig-out/bin/tfload load "$t/quant_tiny.gguf" --experts 1-2 --golden "$t/quant_tiny.tfref"
          zig-out/bin/tfload index "$t/nvfp4_tiny.safetensors" --config "$t/nvfp4_tiny.config.json"
          zig-out/bin/tfload load "$t/nvfp4_tiny.safetensors" --config "$t/nvfp4_tiny.config.json" --experts 0-3 --golden "$t/nvfp4_tiny.tfref"
      - name: Build with the RDMA transport (compile and link only; runners have no RDMA device)
        run: zig build install -Drdma=true --prefix zig-out-rdma
      - name: Cross-compile for DGX Spark (aarch64)
        run: zig build -Dtarget=aarch64-linux-gnu -Dcpu=cortex_a78

  windows:
    name: Engine (Windows x86_64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Unit tests, build, and PoC checks (build.ps1)
        shell: powershell
        run: .\build.ps1 -Port 7471

  inspector:
    name: Inspector (web build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Trace generator check (schema v0, 10,000-packet stress trace)
        run: npm test
      - run: npm run build
