<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TensorFold Live</title>
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --ink: #1b1f24;
  --muted: #4d5866;
  --line: #dde2e8;
  --link: #b4bdc8;
  --cell: #e2e6eb;
  --rank0: 29, 78, 216;
  --rank1: 234, 88, 12;
  --rank2: 147, 51, 234;
  --rank3: 219, 39, 119;
  --ok: #15803d;
  --bad: #b91c1c;
  --user: #e8eefc;
  --think: #f1f3f5;
  --radius: 10px;
  --router: 13, 148, 136;
  --blend: 202, 138, 4;
  --now: 245, 158, 11;
  --drive: 100, 116, 139;
  --ready: 21, 128, 61;
  --miss: 185, 28, 28;
  --skip-bg: #ea580c;
  --skip-ink: #ffffff;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --ink: #e6e9ed;
    --muted: #93a0b0;
    --line: #2a313a;
    --link: #2a313a;
    --cell: #222831;
    --rank0: 96, 145, 255;
    --rank1: 251, 146, 60;
    --rank2: 192, 132, 252;
    --rank3: 244, 114, 182;
    --ok: #4ade80;
    --bad: #f87171;
    --user: #1f2a44;
    --think: #1d2229;
    --router: 45, 212, 191;
    --blend: 250, 204, 21;
    --drive: 148, 163, 184;
    --ready: 74, 222, 128;
    --miss: 248, 113, 113;
    --skip-bg: #fb923c;
    --skip-ink: #000000;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
header { display: flex; gap: 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
header .meta { color: var(--muted); font-size: 13px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 6px; vertical-align: middle; }
.dot.on { background: var(--ok); }
main { flex: 1; display: grid; grid-template-columns: minmax(340px, 45%) 1fr; min-height: 0; }
#chat { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; background: var(--panel); }
#log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
#log > :first-child { margin-top: auto; }
#pinned { padding: 12px 16px; border-bottom: 1px solid var(--line); max-height: 30vh; overflow-y: auto; }
#pinned:empty { display: none; }
#pinned .msg + .msg { margin-top: 8px; }
.md { white-space: normal; }
.md p, .md ul, .md ol, .md pre, .md blockquote { margin: 0 0 8px; }
.md > :last-child { margin-bottom: 0; }
.md ul, .md ol { padding-left: 22px; }
.md li + li { margin-top: 2px; }
.md h3, .md h4, .md h5 { font-size: 14px; margin: 12px 0 6px; }
.md > h3:first-child, .md > h4:first-child, .md > h5:first-child { margin-top: 0; }
.md code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--think); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--think); padding: 8px 10px; border-radius: 8px; overflow-x: auto; white-space: pre; }
.md pre code { background: none; padding: 0; }
.md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
.md a { color: rgb(var(--rank0)); }
.msg { max-width: 100%; white-space: pre-wrap; word-wrap: break-word; line-height: 1.45; font-size: 14px; }
.msg.user { align-self: flex-end; background: var(--user); padding: 8px 12px; border-radius: var(--radius); max-width: 85%; }
.msg.assistant .think { background: var(--think); color: var(--muted); padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
.msg.assistant .think summary { cursor: pointer; user-select: none; }
.msg .foot { color: var(--muted); font-size: 12px; margin-top: 4px; }
.msg.error { color: var(--bad); }
.empty { color: var(--muted); font-size: 14px; margin: auto; text-align: center; max-width: 280px; }
form { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
textarea { width: 100%; resize: none; min-height: 64px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.row label { display: flex; gap: 4px; align-items: center; }
.row input[type=number] { width: 68px; padding: 3px 5px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
button { padding: 7px 16px; border-radius: 8px; border: 0; background: rgb(var(--rank0)); color: #fff; font-weight: 600; cursor: pointer; margin-left: auto; }
button.stop { background: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
#view { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
#stage { flex: 0 1 520px; position: relative; min-height: 240px; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.skip { background: var(--skip-bg); color: var(--skip-ink); border: 0; border-radius: 999px; padding: 2px 10px; font: 600 12px system-ui, sans-serif; line-height: 18px; cursor: pointer; white-space: nowrap; }
.skip:hover { filter: brightness(1.08); }
.skip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#stage .skip { position: absolute; z-index: 1; }
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(128, 128, 128, 0.15); background: color-mix(in srgb, var(--bg) 60%, transparent); }
#loading .card { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
.spin { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--line); border-top-color: rgb(var(--rank0)); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
#stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.stat { background: var(--panel); padding: 10px 14px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat .s { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.good { color: var(--ok); }
.warn { color: var(--bad); }
.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); margin-left: 0; font-weight: 500; padding: 5px 12px; }
.ghost:hover, .ghost.on { background: var(--cell); }
.seg { display: inline-flex; }
.seg .ghost { border-radius: 0; font-size: 13px; }
.seg .ghost:first-child { border-radius: 8px 0 0 8px; }
.seg .ghost:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
header .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
label.ghost { border-radius: 8px; cursor: pointer; font-size: 13px; }
a.ghost { border-radius: 8px; font-size: 13px; text-decoration: none; }
#pick { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; max-width: 360px; }
.badge { background: var(--user); color: var(--ink); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
.msg.note a { color: rgb(var(--rank0)); }
@media (max-width: 640px) {
  header .tools { margin-left: 0; flex-wrap: wrap; }
  #pick { max-width: 100%; flex: 1 1 100%; }
}
#player { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--panel); font-size: 13px; color: var(--muted); flex-wrap: wrap; }
#player input[type=range] { flex: 1; min-width: 140px; }
#player select { padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
#clock { font-variant-numeric: tabular-nums; min-width: 120px; text-align: right; }
.msg.note { color: var(--muted); font-size: 13px; }
.msg.status { align-self: flex-start; background: var(--think); color: var(--muted); font-size: 13px; padding: 8px 12px; border-radius: var(--radius); min-width: min(260px, 100%); }
.msg.status .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.msg.status .what { flex: 1; min-width: 0; }
.msg.status .dots { display: inline-flex; gap: 3px; vertical-align: middle; }
.msg.status .dots i { width: 5px; height: 5px; border-radius: 50%; background: rgb(var(--now)); animation: blink 1.2s infinite ease-in-out; }
.msg.status .dots i:nth-child(2) { animation-delay: 0.2s; }
.msg.status .dots i:nth-child(3) { animation-delay: 0.4s; }
.msg.status .bar { height: 3px; margin-top: 6px; background: var(--cell); border-radius: 2px; overflow: hidden; }
.msg.status .bar > div { height: 100%; width: 0; background: rgb(var(--now)); }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .msg.status .dots i { animation: none; opacity: 0.6; } }
body.dragging main { outline: 3px dashed rgb(var(--rank0)); outline-offset: -6px; }
@media (max-width: 800px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(300px, 1fr) minmax(360px, 1fr); }
  #chat { border-right: 0; border-bottom: 1px solid var(--line); }
  #pinned { max-height: 84px; }
}
@media (min-width: 801px) and (min-height: 900px) {
  #views { display: none; }
  #stage { flex: 1 1 980px; min-height: 700px; }
}
</style>
</head>
<body>
<header>
  <h1>TensorFold Live</h1>
  <span class="badge" id="badge" hidden>Recording of the real engine</span>
  <span class="meta"><span id="dot" class="dot"></span><span id="conn">connecting to the engine</span></span>
  <span class="meta" id="model"></span>
  <span class="tools">
    <span class="seg" id="views" role="group" aria-label="diagram">
      <button type="button" class="ghost on" data-view="heat" aria-pressed="true">All experts</button>
      <button type="button" class="ghost" data-view="flow" aria-pressed="false">One token</button>
    </span>
    <select id="pick" aria-label="recording" hidden></select>
    <a id="inspector" class="ghost" href="inspector.html" hidden>3D inspector</a>
    <a id="repo" class="ghost" href="https://github.com/AIForGames2026/DistributedMoEEngine" hidden>Source</a>
    <button id="golive" class="ghost" type="button" hidden>Back to live</button>
    <label class="ghost">Replay a recording<input type="file" id="file" accept=".jsonl,.gz,.json,.txt" hidden></label>
  </span>
</header>
<main>
  <section id="chat">
    <div id="pinned"></div>
    <div id="log"><div class="empty" id="empty">Send a message. Each token's experts light up on the machine that ran them.</div></div>
    <form id="form">
      <textarea id="input" placeholder="Message the model (Enter sends, Shift+Enter for a new line)"></textarea>
      <div class="row">
        <label>max tokens <input type="number" id="max" value="512" min="1" max="32768"></label>
        <label>temperature <input type="number" id="temp" value="0" min="0" max="2" step="0.1"></label>
        <label id="thinkbox" hidden><input type="checkbox" id="think" checked> thinking</label>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
  </section>
  <section id="view">
    <div id="stage"><canvas id="canvas"></canvas><button type="button" class="skip" id="skipMap" hidden>Skip reading</button><button type="button" class="skip" id="skipFlow" hidden>Skip reading</button><div id="loading" role="status" hidden><div class="card"><div class="spin"></div><span id="loadmsg">Loading the recording...</span></div></div></div>
    <div id="player" hidden>
      <button id="play" class="ghost" type="button">Pause</button>
      <select id="speed" aria-label="Chat speed: the replay's speed"></select>
      <select id="mapSpeed" aria-label="All experts speed, against the engine's own pace"></select>
      <select id="pace" aria-label="One token speed, in layers per second"></select>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="replay position">
      <span id="clock">0.0 / 0.0 s</span>
    </div>
    <div id="stats"></div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const css = getComputedStyle(document.documentElement);
const color = (name) => css.getPropertyValue(name).trim();

// Everything the diagram knows, reset on each new connection.
let topo = null;
let live = null;
// The recording being replayed, if any (TASK-16).
let rp = null;
let ws = null;
// On the public site (TASK-18) the page never connects to an engine and replays only the recordings this manifest lists.
const showcase = document.querySelector('meta[name="tensorfold-showcase"]')?.content || null;

function freshState(h) {
  const ranks = h.ranks.length;
  const cols = [];
  const colOf = new Int32Array(h.experts);
  for (let r = 0; r < ranks; r++) cols.push([]);
  for (let e = 0; e < h.experts; e++) {
    const r = Math.min(h.owner[e], ranks - 1);
    colOf[e] = cols[r].length;
    cols[r].push(e);
  }
  return {
    cols, colOf,
    drawn: new Array(ranks).fill(0),
    base: null,
    engine: null,
    frames: 0, dropped: 0, rejected: 0, lastSeq: -1, gapAfterFirst: false,
    decode: [], prefill: null,
    rtt: [], cache0: null, cache: null,
    offset: 0, delay: 0,
    // Machines whose experts come from a drive through a cache (TASK-41); older recordings have none.
    cacheRanks: new Set(Array.isArray(h.cache_ranks) ? h.cache_ranks.filter((r) => Number.isInteger(r) && r >= 0 && r < ranks) : []),
  };
}

function connect() {
  if (rp) return;
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/telemetry");
  ws.onmessage = (ev) => {
    let f;
    try { f = JSON.parse(ev.data); } catch { if (live) live.rejected++; return; }
    if (!f || typeof f !== "object" || typeof f.t !== "string") { if (live) live.rejected++; return; }
    if (f.t === "hello") return onHello(f);
    if (f.t === "step") return onStep(f);
    if (f.t === "text" && typeof f.s === "string")
    {
      onText(f);
    }
  };
  ws.onopen = () => setConn(true);
  ws.onclose = () => { if (rp) return; setConn(false); setTimeout(connect, 1000); };
}

function setConn(on) {
  $("dot").classList.toggle("on", on);
  $("conn").textContent = on ? "live" : "not connected; retrying";
}

function validHello(h) {
  const n = (v) => Number.isInteger(v) && v > 0 && v <= 4096;
  return h.schema === "tensorfold.live" && h.version === 0 && n(h.layers) && n(h.experts) && n(h.top_k) &&
    Array.isArray(h.ranks) && h.ranks.length >= 1 && h.ranks.length <= 64 &&
    Array.isArray(h.owner) && h.owner.length === h.experts && h.owner.every((o) => Number.isInteger(o) && o >= 0 && o < h.ranks.length);
}

function onHello(h) {
  if (!validHello(h)) { if (live) live.rejected++; return; }
  topo = h;
  live = freshState(h);
  live.offset = performance.now() - h.ms;
  resetAnim();
  $("model").textContent = `${h.model} · ${h.layers} layers × ${h.experts} experts, top ${h.top_k} · ${h.transport}`;
  $("thinkbox").hidden = !/qwen/i.test(h.model);
}

function validStep(f) {
  return Number.isInteger(f.seq) && Number.isInteger(f.n) && f.n > 0 && typeof f.ms === "number" &&
    Array.isArray(f.x) && f.x.length % 3 === 0 && Array.isArray(f.engine) && Array.isArray(f.layer_us);
}

function stepInRange(f, h) {
  for (let i = 0; i < f.x.length; i += 3) {
    const l = f.x[i], e = f.x[i + 1], c = f.x[i + 2];
    if (!(Number.isInteger(l) && l >= 0 && l < h.layers && Number.isInteger(e) && e >= 0 && e < h.experts && c > 0)) return false;
  }
  // Cache statuses and prefetch hints (TASK-41) are optional, but checked when present.
  const triples = (a, third) => {
    if (!Array.isArray(a) || a.length % 3 !== 0)
    {
      return false;
    }
    for (let i = 0; i < a.length; i += 3)
    {
      const l = a[i], e = a[i + 1];
      if (!(Number.isInteger(l) && l >= 0 && l < h.layers && Number.isInteger(e) && e >= 0 && e < h.experts && third(a[i + 2])))
      {
        return false;
      }
    }
    return true;
  };
  if (f.c !== undefined && !triples(f.c, (s) => Number.isInteger(s) && s >= 1 && s <= 4))
  {
    return false;
  }
  if (f.h !== undefined && !triples(f.h, (s) => Number.isInteger(s) && s >= 0 && s < h.layers))
  {
    return false;
  }
  return f.engine.length === Math.max(2, h.ranks.length);
}

function onStep(f, word = "") {
  if (!topo || !validStep(f) || !stepInRange(f, topo)) { if (live) live.rejected++; return; }
  const ranks = topo.ranks.length;
  const byRank = new Array(ranks).fill(0);
  if (live.lastSeq >= 0 && f.seq !== live.lastSeq + 1) {
    live.dropped += f.seq - live.lastSeq - 1;
    live.gapAfterFirst = true;
  }
  live.lastSeq = f.seq;
  live.frames++;
  for (let i = 0; i < f.x.length; i += 3) {
    const l = f.x[i], e = f.x[i + 1], c = f.x[i + 2];
    const r = Math.min(topo.owner[e], ranks - 1);
    byRank[r] += c;
  }
  for (let r = 0; r < ranks; r++) live.drawn[r] += byRank[r];
  if (live.base === null) {
    live.base = f.engine.map((v, r) => (v === null ? null : v - byRank[r]));
    live.cache0 = f.cache;
  }
  live.engine = f.engine;
  // The link's round trip over the last two seconds.
  live.rtt.push({ ms: f.ms, us: f.rtt_us, layers: f.rtt_layers });
  while (live.rtt.length > 2 && f.ms - live.rtt[1].ms > 2000) live.rtt.shift();
  live.cache = f.cache;
  live.delay = performance.now() - live.offset - f.ms;
  if (f.n === 1) {
    live.decode.push(f.ms);
    while (live.decode.length > 1 && f.ms - live.decode[0] > 3000) live.decode.shift();
  } else {
    live.prefill = { n: f.n, ms: f.step_us / 1000 };
  }
  animFeed(f, word);
}

// Large windows show both views, All experts above One token; smaller ones pick one, All experts first.
let view = "heat";
const bothViews = window.matchMedia("(min-width: 801px) and (min-height: 900px)");
// Each view animates steps on its own clock: All experts near the recording's pace, One token at its
// chosen layers per second. Neither holds the replay back; each skips to the newest step when behind.
const anim = { cur: null, next: null, recent: null, dropping: 0 };
const mapAnim = { cur: null, next: null, recent: null, dropping: 0 };
const OUT_MS = 1600;

function resetAnim() {
  for (const a of [anim, mapAnim])
  {
    a.cur = null;
    a.next = null;
    a.recent = null;
    a.dropping = 0;
  }
}

function ownerOf(e) {
  return Math.min(topo.owner[e], topo.ranks.length - 1);
}

function animFeed(f, word) {
  const layers = [];
  for (let l = 0; l < topo.layers; l++)
  {
    layers.push([]);
  }
  for (let i = 0; i < f.x.length; i += 3)
  {
    layers[f.x[i]].push({ e: f.x[i + 1], c: f.x[i + 2] });
  }
  for (const picks of layers)
  {
    picks.sort((a, b) => b.c - a.c);
  }
  const us = f.layer_us.filter((v) => typeof v === "number" && v > 0);
  const step = {
    seq: f.seq, n: f.n, layers, word, layerUs: f.layer_us,
    realUs: us.length ? us.reduce((a, b) => a + b, 0) / us.length : 0,
    ...cacheView(f),
  };
  for (const a of [anim, mapAnim])
  {
    const entry = { ...step, prev: a.recent, skipped: 0, l: 0, u: 0, out: 0 };
    a.recent = entry;
    if (rp && rp.seeking)
    {
      continue;
    }
    if (a.cur === null)
    {
      a.cur = entry;
      continue;
    }
    if (a.next !== null)
    {
      a.dropping++;
    }
    a.next = entry;
  }
}

// A step's cache calls and prefetch hints (TASK-41): each call's status, the hints sent during each layer,
// and the experts a hint brought in from the drive, drawn as prefetched or still loading until their layer.
function cacheView(f) {
  const status = new Map();
  const counts = [0, 0, 0, 0, 0];
  for (let i = 0; Array.isArray(f.c) && i < f.c.length; i += 3)
  {
    status.set(f.c[i] * topo.experts + f.c[i + 1], f.c[i + 2]);
    counts[f.c[i + 2]]++;
  }
  const hints = [];
  for (let l = 0; l < topo.layers; l++)
  {
    hints.push([]);
  }
  const ahead = [];
  for (let i = 0; Array.isArray(f.h) && i < f.h.length; i += 3)
  {
    const h = { l: f.h[i], e: f.h[i + 1], sent: f.h[i + 2] };
    h.st = status.get(h.l * topo.experts + h.e) || 0;
    // A hint brought the expert in when its call found it prefetched (2) or still loading (3).
    h.load = (h.st === 2 || h.st === 3) && live.cacheRanks.has(ownerOf(h.e));
    hints[h.sent].push(h);
    if (h.load)
    {
      ahead.push(h);
    }
  }
  return { status, counts, hints, ahead, hasCache: Array.isArray(f.c) && live.cacheRanks.size > 0 };
}

// The live feed sends a token's text just after its step.
function onText(f) {
  for (const a of [anim, mapAnim])
  {
    for (const e of new Set([a.recent, a.next, a.cur]))
    {
      if (e && e.seq === f.after)
      {
        e.word += f.s;
      }
    }
  }
}

// One token climbs at the chosen layers per second.
function layerMs() {
  return 1000 / animSpeed;
}

// All experts at a multiple of the engine's own pace: at 1x each layer takes as long as it took when recorded.
function mapLayerMs(c, l) {
  const us = Array.isArray(c.layerUs) && c.layerUs[l] > 0 ? c.layerUs[l] : c.realUs;
  if (us > 0)
  {
    return us / 1000 / mapSpeed;
  }
  return Math.max(40, Math.min(200, 3000 / topo.layers)) / mapSpeed; // A step without layer times
}

// Three speeds: the chat (the replay's clock), All experts against the engine's pace, and One token in layers per second.
const REAL_SPEEDS = ["0.25", "0.5", "1", "2", "4", "10", "16"], WORD_SPEEDS = ["0.5", "1", "1.5", "2", "4", "8", "16"];
let animSpeed = 1, mapSpeed = 1;
const MAP_OUT_MS = 600; // How long All experts keeps a finished token's path before the next

function fillSpeeds() {
  $("speed").innerHTML = REAL_SPEEDS.map((v) => `<option value="${v}">Chat: ${v}×</option>`).join("");
  $("speed").value = String(rp ? rp.speed : 1);
  $("mapSpeed").innerHTML = REAL_SPEEDS.map((v) => `<option value="${v}">All experts: ${v}×</option>`).join("");
  $("mapSpeed").value = String(mapSpeed);
  $("pace").innerHTML = WORD_SPEEDS.map((v) => `<option value="${v}">One token: ${v} layer${v === "1" ? "" : "s"}/s</option>`).join("");
  $("pace").value = String(animSpeed);
}

function animTick(dt) {
  tickAnim(anim, layerMs, dt, OUT_MS);
  tickAnim(mapAnim, mapLayerMs, dt, MAP_OUT_MS);
}

function tickAnim(anim, layerMs, dt, outMs) {
  const pace = rp && (!rp.playing || rp.dragging) ? 0 : 1;
  let ms = dt * 1000 * pace;
  while (ms > 0 && anim.cur)
  {
    const c = anim.cur;
    const span = c.l < topo.layers ? layerMs(c, c.l) : outMs;
    const left = (1 - (c.l < topo.layers ? c.u : c.out)) * span;
    if (ms < left)
    {
      if (c.l < topo.layers)
      {
        c.u += ms / span;
      }
      else
      {
        c.out += ms / span;
      }
      ms = 0;
    }
    else if (c.l < topo.layers)
    {
      ms -= left;
      c.l++;
      c.u = 0;
    }
    else
    {
      ms -= left;
      anim.cur = anim.next;
      anim.next = null;
      if (anim.cur)
      {
        anim.cur.skipped = anim.dropping;
      }
      anim.dropping = 0;
    }
  }
}

function ease(t) {
  return t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t);
}

function shownWord(w) {
  const s = w.replace(/\n/g, "⏎").replace(/\s+/g, " ").trim();
  return s || (w ? "space" : "…");
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect)
  {
    ctx.roundRect(x, y, w, h, r);
  }
  else
  {
    ctx.rect(x, y, w, h);
  }
}

function strokePath(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++)
  {
    ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.stroke();
}

// The largest square cells that fit `n` dots in the area.
function dotGrid(n, ax, ay, aw, ah) {
  let s = 0, cols = 1;
  for (let c = 1; c <= n; c++)
  {
    const fit = Math.min(aw / c, ah / Math.ceil(n / c));
    if (fit > s)
    {
      s = fit;
      cols = c;
    }
  }
  s = Math.min(s, 26); // Large areas keep small dots, so 64 experts don't read as a few big buttons
  const rows = Math.ceil(n / cols);
  const ox = ax + (aw - s * cols) / 2 + s / 2, oy = ay + (ah - s * rows) / 2 + s / 2;
  return { s, cols, rows, at: (i) => ({ x: ox + (i % cols) * s, y: oy + Math.floor(i / cols) * s }) };
}

function chip(text, cx, cy, maxW, hot) {
  ctx.font = "600 12px system-ui, sans-serif";
  let t = text;
  while (t.length > 2 && ctx.measureText(t).width > maxW - 14)
  {
    t = t.slice(0, -2) + "…";
  }
  const w = Math.min(maxW, ctx.measureText(t).width + 14);
  rrect(cx - w / 2, cy - 11, w, 22, 6);
  ctx.fillStyle = hot ? `rgba(${color("--now")}, 0.28)` : color("--panel");
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = hot ? `rgb(${color("--now")})` : color("--line");
  ctx.stroke();
  ctx.fillStyle = color("--ink");
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(t, cx, cy + 1);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

function rttPerLayer() {
  const r0 = live.rtt[0], r1 = live.rtt[live.rtt.length - 1];
  return r0 && r1.layers > r0.layers ? (r1.us - r0.us) / (r1.layers - r0.layers) : null;
}

// The diagram keeps a moderate size and sits centered, so big screens don't stretch it.
function drawFlow(W, H, oy = 0) {
  const fw = Math.min(W, 900), fh = H;
  const dx = Math.round((W - fw) / 2), dy = oy;
  const headH = 52;
  const big = "600 15px system-ui, sans-serif";
  ctx.font = big;
  const heads = flowHeading(anim.cur);
  addText(heads.find((t) => ctx.measureText(t).width <= fw - 28) || "", dx + fw / 2, dy + 22, big, "--ink", "center");
  drawStepNote(animNote(anim, layerMs), dx + fw / 2, dy + 42, fw - 28, $("skipFlow"));
  ctx.save();
  ctx.translate(dx, dy + headH);
  textShift.x = dx;
  textShift.y = dy + headH;
  drawFlowIn(fw, fh - headH);
  ctx.restore();
  textShift.x = 0;
  textShift.y = 0;
}

function drawFlowIn(W, H) {
  const L = topo.layers, ranks = topo.ranks.length, c = anim.cur;
  const small = W < 560, pad = 14;
  const font = "12px system-ui, sans-serif", bold = "600 12px system-ui, sans-serif";
  const cellBg = color("--cell"), link = color("--link"), rgbOf = rankRgb;
  const bare = live.cols[0].length === 0; // Rank 0 may only route, with every expert on other machines
  const sw = small ? 26 : Math.max(36, Math.min(56, W * 0.06));
  const sx = pad, sTop = pad + 60, sBot = H - pad - 54;
  const rr = small ? 15 : Math.max(18, Math.min(26, H * 0.045));
  const lane = small ? 10 : 18;
  // A machine with an expert cache gets a strip for its drive, and the key a row for the cache states.
  const caching = live.cacheRanks.size > 0;
  const driveH = caching ? (small ? 24 : 30) : 0;
  const top = pad + 26, bot = H - pad - (caching ? 62 : 44), gapB = ranks > 1 ? 26 : 0;
  const slotH = (bot - top - gapB * (ranks - 1)) / ranks;
  // Machine boxes fit their dots, and the router and blend sit just outside them.
  const areaL = sx + sw + (small ? 24 : 40), areaR = W - pad - 2;
  const maxBW = Math.max(60, areaR - areaL - 4 * rr - 4 * lane);
  ctx.font = bold;
  const heads = [];
  for (let r = 0; r < ranks; r++)
  {
    const ids = live.cols[r];
    const range = ids.length && ids[ids.length - 1] - ids[0] === ids.length - 1 ? `experts ${ids[0]} to ${ids[ids.length - 1]}` : `${ids.length} experts`;
    const options = [`rank ${r} · ${topo.ranks[r]} · ${range}`, `${topo.ranks[r]} · ${range}`, topo.ranks[r]];
    heads.push(options.find((t) => ctx.measureText(t).width <= maxBW - 16) || `rank ${r}`);
  }
  const fits = live.cols.map((ids) => dotGrid(ids.length, 0, 0, maxBW - 16, slotH - 30 - driveH));
  const headW = Math.max(...heads.map((t) => ctx.measureText(t).width));
  const bw = Math.min(maxBW, Math.max(160, headW + 16, ...fits.map((f) => f.cols * f.s + 16)));
  const bh = Math.min(slotH, Math.max(Math.max(...fits.map((f) => f.rows * f.s)) + 34 + driveH, 2 * rr + 60));
  const x0 = areaL + Math.max(0, (areaR - areaL - bw - 4 * rr - 4 * lane) / 2);
  const rx = x0 + rr, ry = top + slotH / 2; // The router and blend run on rank 0, so they sit level with its experts
  const ch1 = rx + rr + lane, mx0 = ch1 + lane, mx1 = mx0 + bw, ch2 = mx1 + lane;
  const bx = ch2 + lane + rr, by = ry;
  const loopY = pad + 6, loopX = sx + sw + 16, outY = pad + 34;
  const cl = c ? Math.min(c.l, L) : -1, u = c && c.l < L ? c.u : 0;
  const picks = c && cl < L ? c.layers[cl] : [];
  const peak = picks.reduce((m, p) => Math.max(m, p.c), 1);

  // The layer stack, layer 1 at the bottom.
  const g = L > 24 ? 1 : 2;
  const slab = Math.max(1, (sBot - sTop - g * (L - 1)) / L);
  const ly = (i) => sBot - i * (slab + g) - slab / 2;
  for (let i = 0; i < L; i++)
  {
    ctx.fillStyle = i < cl ? color("--muted") : i === cl ? `rgb(${color("--now")})` : cellBg; // Gray, so no machine's color is implied
    ctx.globalAlpha = i < cl ? 0.6 : 1;
    ctx.fillRect(sx, ly(i) - slab / 2, sw, slab);
    ctx.globalAlpha = 1;
  }

  // Machines, with their experts as dots.
  const boxes = [];
  for (let r = 0; r < ranks; r++)
  {
    const y0 = top + r * (slotH + gapB) + (slotH - bh) / 2;
    const ids = live.cols[r];
    const drive = live.cacheRanks.has(r) && ids.length ? { x: mx0 + (small ? 30 : 46), y: y0 + bh - 6 - driveH / 2 } : null;
    boxes.push({ y0, my: y0 + bh / 2, grid: dotGrid(ids.length, mx0 + 8, y0 + 24, mx1 - mx0 - 16, bh - 30 - driveH), drive });
  }
  const outPath = (r) => [{ x: rx + rr, y: ry }, { x: ch1, y: ry }, { x: ch1, y: boxes[r].my }, { x: mx0, y: boxes[r].my }];
  const backPath = (r) => [{ x: mx1, y: boxes[r].my }, { x: ch2, y: boxes[r].my }, { x: ch2, y: by }, { x: bx - rr, y: by }];
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = link;
  for (let r = bare ? 1 : 0; r < ranks; r++)
  {
    ctx.lineWidth = r === 0 ? 2 : small ? 4 : 6; // Thin wires inside rank 0's machine, a thick cable to each other one
    strokePath(outPath(r));
    strokePath(backPath(r));
  }

  // The token's way in from its layer, and back up to the next one (or out, after the last).
  const nextY = cl + 1 < L ? ly(cl + 1) : outY;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  strokePath([{ x: bx, y: by - rr }, { x: bx, y: loopY }, { x: loopX, y: loopY }, { x: loopX, y: nextY }, { x: sx + sw + 2, y: nextY }]);
  ctx.setLineDash([]);
  if (c && cl < L)
  {
    ctx.strokeStyle = `rgb(${color("--now")})`;
    strokePath([{ x: sx + sw + 2, y: ly(cl) }, { x: rx - rr, y: ry }]);
  }

  for (let r = 0; r < ranks; r++)
  {
    const b = boxes[r], ids = live.cols[r], rgb = rgbOf(r);
    if (r === 0)
    {
      // Rank 0's machine holds the router, the blend and its own experts.
      const ox0 = rx - rr - 12, ox1 = bx + rr + 12;
      rrect(ox0, b.y0, ox1 - ox0, bh, 10);
      ctx.fillStyle = `rgba(${rgb}, 0.06)`;
      ctx.fill();
      ctx.strokeStyle = `rgba(${rgb}, 0.75)`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.font = bold;
      let options;
      if (bare)
      {
        addText("no experts here: this machine only routes and blends", (mx0 + mx1) / 2, b.my + 4, font, "--muted", "center");
        options = [`rank 0 · ${topo.ranks[0]} · router and blend only`, `${topo.ranks[0]} · router and blend`, topo.ranks[0]];
      }
      else
      {
        rrect(mx0, b.y0 + 24, mx1 - mx0, bh - 30, 6);
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = `rgba(${rgb}, 0.45)`;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.setLineDash([]);
        const range = heads[0].includes("experts") ? heads[0].slice(heads[0].indexOf("experts")) : "its experts";
        options = [`rank 0 · ${topo.ranks[0]} · router, blend and ${range}`, `${topo.ranks[0]} · router, blend, ${range}`, `${topo.ranks[0]} · router and blend`, topo.ranks[0]];
      }
      addText(options.find((t) => ctx.measureText(t).width <= ox1 - ox0 - 16) || "rank 0", ox0 + 8, b.y0 + 16, bold, "--ink");
    }
    else
    {
      rrect(mx0, b.y0, mx1 - mx0, bh, 8);
      ctx.strokeStyle = `rgba(${rgb}, 0.75)`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      addText(heads[r], mx0 + 8, b.y0 + 16, bold, "--ink");
    }
    const rad = Math.max(1, b.grid.s * 0.36);
    for (let i = 0; i < ids.length; i++)
    {
      const p = b.grid.at(i);
      ctx.fillStyle = cellBg;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Each machine's drive, and the experts hints brought in from it, prefetched or still loading until their layer comes.
  for (const b of boxes)
  {
    if (b.drive)
    {
      drawDrive(b.drive.x, b.drive.y, small);
    }
  }
  const statusOf = (l, e) => (c && c.status ? c.status.get(l * topo.experts + e) || 0 : 0);
  const dotOf = (e) => {
    const r = ownerOf(e), b = boxes[r];
    return { r, b, q: b.grid.at(live.colOf[e]), rad: Math.max(1.5, b.grid.s * 0.36) };
  };
  const LOAD0 = 0.35, LOAD1 = 0.95;
  if (c && c.ahead && cl < L)
  {
    for (const h of c.ahead)
    {
      const landed = cl > h.sent || (cl === h.sent && u >= LOAD1);
      if (cl < h.l && (landed || (cl === h.sent && u >= LOAD0)))
      {
        const d = dotOf(h.e);
        drawExpert(d.q.x, d.q.y, d.rad, rgbOf(d.r), landed && h.st === 2 ? "ready" : "loading", 0);
      }
    }
  }
  // Hints sent during this layer: a faint packet toward each guessed expert, then a load from the drive for those not already in place.
  const sent = c && c.hints && cl < L ? c.hints[cl].slice(0, c.n > 1 ? 24 : 64) : [];
  for (const h of sent)
  {
    const d = dotOf(h.e);
    if (u < 0.45)
    {
      const at = pointAt([...outPath(d.r), d.q], ease(u / 0.45), 0);
      ctx.fillStyle = `rgba(${rgbOf(d.r)}, 0.35)`;
      ctx.beginPath();
      ctx.arc(at.x, at.y, small ? 2 : 2.8, 0, Math.PI * 2);
      ctx.fill();
    }
    if (h.load && d.b.drive && u >= LOAD0 && u < LOAD1)
    {
      drawLoad(d.b.drive, d.q, (u - LOAD0) / (LOAD1 - LOAD0), small);
    }
  }

  // Each picked expert goes from waiting for the token, to working on it, to sending its answer back.
  // An expert that missed, or whose prefetch was late, first waits on the drive.
  const arriveOf = (remote) => (remote ? 0.42 : 0.3);
  const shown = picks.slice(0, c && c.n > 1 ? 48 : picks.length);
  for (const p of picks)
  {
    const r = ownerOf(p.e), remote = r > 0;
    const a0 = arriveOf(remote), b0 = 0.58, b1 = remote ? 0.97 : 0.85;
    const b = boxes[r], q = b.grid.at(live.colOf[p.e]);
    const rad = Math.max(1.5, b.grid.s * 0.36);
    const st = statusOf(cl, p.e);
    const waits = (st === 3 || st === 4) && b.drive;
    const w0 = waits ? a0 + 0.14 : a0;
    if (u < a0)
    {
      drawExpert(q.x, q.y, rad, rgbOf(r), "picked", 0);
    }
    else if (u < w0)
    {
      drawExpert(q.x, q.y, rad, rgbOf(r), st === 4 ? "missed" : "loading", 0);
      drawLoad(b.drive, q, (u - a0) / (w0 - a0), small);
    }
    else if (u < b0)
    {
      drawExpert(q.x, q.y, rad, rgbOf(r), "working", (u - w0) / (b0 - w0));
    }
    else if (u < b1)
    {
      drawExpert(q.x, q.y, rad, rgbOf(r), "answered", 0);
    }
  }
  for (const p of shown)
  {
    const r = ownerOf(p.e), remote = r > 0;
    const q = boxes[r].grid.at(live.colOf[p.e]);
    const a0 = arriveOf(remote), b0 = 0.58, b1 = remote ? 0.97 : 0.85;
    let path = null, t = 0;
    if (u < a0)
    {
      path = [...outPath(r), q];
      t = u / a0;
    }
    else if (u >= b0 && u < b1)
    {
      path = [q, ...backPath(r)];
      t = (u - b0) / (b1 - b0);
    }
    if (path)
    {
      // Eased, with a fading tail, so each packet reads as one thing travelling a route.
      for (let k = 4; k >= 0; k--)
      {
        const tk = t - k * 0.035;
        if (tk < 0)
        {
          continue;
        }
        const at = pointAt(path, ease(tk), 0);
        ctx.fillStyle = `rgba(${rgbOf(r)}, ${k === 0 ? 1 : 0.45 - k * 0.09})`;
        ctx.beginPath();
        ctx.arc(at.x, at.y, (small ? 3 : 4.5) * (1 - k * 0.12), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // The router picks the experts; the blend mixes their answers by the router's weights.
  const node = (x, y, name, glow) => {
    ctx.beginPath();
    ctx.arc(x, y, rr, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${color(name === "router" ? "--router" : "--blend")}, ${glow ? 0.45 : 0.16})`;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = `rgb(${color(name === "router" ? "--router" : "--blend")})`;
    ctx.stroke();
    if (rr >= 18)
    {
      ctx.font = bold;
      ctx.fillStyle = color("--ink");
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(name, x, y + 1);
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
    }
  };
  node(rx, ry, "router", c && cl < L && u < 0.12);
  node(bx, by, "blend", c && cl < L && u >= 0.85);
  const many = c && c.n > 1;
  addText(rr >= 18 ? (many ? `${topo.top_k} per token` : `picks ${topo.top_k} of ${topo.experts}`) : "router", rx, ry + rr + 16, font, "--muted", "center");
  addText(rr >= 18 ? "weighted mix" : "blend", bx, by + rr + 16, font, "--muted", rr >= 18 ? "center" : "right");
  // How this token's (or prompt's) expert calls found their experts, beside the drive.
  const driveBox = boxes.find((b) => b.drive);
  if (driveBox && c && c.hasCache)
  {
    const k = c.counts, who = c.n > 1 ? "this prompt" : "this token";
    ctx.font = font;
    const roomC = mx1 - driveBox.drive.x - (small ? 30 : 44) - 8;
    const options = [
      `${who}: ${k[1]} in memory · ${k[2]} prefetched · ${k[3]} late · ${k[4]} missed`,
      `${k[1]} in memory · ${k[2]} prefetched · ${k[3]} late · ${k[4]} missed`,
      `${k[2]} prefetched · ${k[3] + k[4]} from the drive`,
    ];
    const t = options.find((s) => ctx.measureText(s).width <= roomC);
    if (t)
    {
      addText(t, driveBox.drive.x + (small ? 30 : 44), driveBox.drive.y + 4, font, "--muted");
    }
  }
  if (ranks > 1)
  {
    const rtt = rttPerLayer();
    addText(`${topo.transport} cable${rtt !== null && !small ? ` · ${rtt.toFixed(0)} µs round trip per layer` : ""}`, (mx0 + mx1) / 2, top + slotH + gapB / 2 + 4, font, "--muted", "center");
  }

  // The word moving through: the input at the bottom, the next token at the top, then off to the chat.
  if (c && cl < L && u >= 0.88)
  {
    ctx.strokeStyle = `rgb(${color("--now")})`; // The blended result heads up to the next layer
    ctx.lineWidth = 2;
    strokePath([{ x: bx, y: by - rr }, { x: bx, y: loopY }, { x: loopX, y: loopY }, { x: loopX, y: nextY }, { x: sx + sw + 2, y: nextY }]);
  }
  const cx = sx + sw / 2, chipW = sw + 24;
  const input = !c ? "" : c.n > 1 ? `${c.n} tokens` : c.prev ? shownWord(c.prev.word) : "…";
  chip(input || "…", cx, sBot + 22, chipW, false);
  const done = c && c.l >= L;
  chip(done ? shownWord(c.word) : "?", cx, outY, chipW, done);
  const chatAbove = innerWidth <= 800;
  addText(done ? (chatAbove ? "▲ to the chat" : "◀ to the chat") : "next token", sx - 2, pad + 10, done ? bold : font, done ? "--ink" : "--muted");
  addText(c && c.n > 1 ? "prompt" : "input", sx - 2, sBot + 48, font, "--muted");
  if (c && cl < L)
  {
    addText(`layer ${cl + 1}`, sx + sw + 4, ly(cl) - 7, bold, "--ink");
  }

  ctx.font = font;
  const room = W - areaL - pad;

  // A key: what each expert dot's look means, then each machine's color.
  const stateY = H - pad - 22, keyY = H - pad - 4;
  const keyRgb = rgbOf(bare ? 1 : 0);
  const states = [["idle", "idle"], ["picked", "token on its way"], ["working", "working"], ["answered", "answer on its way back"]];
  const short = [["idle", "idle"], ["picked", "picked"], ["working", "working"], ["answered", "answering"]];
  const width = (list) => list.reduce((w, s) => w + 30 + ctx.measureText(s[1]).width, ctx.measureText("Expert:").width + 8);
  let sxk = areaL + ctx.measureText("Expert:").width + 12;
  addText("Expert:", areaL, stateY, font, "--muted");
  for (const [state, text] of width(states) <= room ? states : short)
  {
    drawExpert(sxk + 6, stateY - 4, 5, keyRgb, state, 0.7);
    addText(text, sxk + 16, stateY, font, "--ink");
    sxk += 30 + ctx.measureText(text).width;
  }
  if (caching)
  {
    const cacheY = stateY - 18;
    const cstates = [["ready", "prefetched and ready"], ["loading", "loading from the drive"], ["missed", "missed: the token waits on the drive"]];
    const cshort = [["ready", "prefetched"], ["loading", "loading"], ["missed", "missed"]];
    const cwidth = (list) => list.reduce((w, s) => w + 30 + ctx.measureText(s[1]).width, ctx.measureText("Cache:").width + 8);
    let cx2 = areaL + Math.max(ctx.measureText("Expert:").width, ctx.measureText("Cache:").width) + 12;
    addText("Cache:", areaL, cacheY, font, "--muted");
    for (const [state, text] of cwidth(cstates) <= room ? cstates : cshort)
    {
      drawExpert(cx2 + 6, cacheY - 4, 5, keyRgb, state, 0);
      addText(text, cx2 + 16, cacheY, font, "--ink");
      cx2 += 30 + ctx.measureText(text).width;
    }
  }
  const lead = ["Color = the machine an expert is on:", "Machine:", ""].find((t) => {
    let w = ctx.measureText(t).width + 8;
    for (let r = bare ? 1 : 0; r < ranks; r++)
    {
      w += ctx.measureText(topo.ranks[r]).width + 26;
    }
    return w <= room || t === "";
  });
  let kx = areaL;
  if (lead)
  {
    addText(lead, kx, keyY, font, "--muted");
    kx += ctx.measureText(lead).width + 12;
  }
  for (let r = bare ? 1 : 0; r < ranks; r++)
  {
    ctx.fillStyle = `rgb(${rgbOf(r)})`;
    ctx.beginPath();
    ctx.arc(kx + 5, keyY - 4, 5, 0, Math.PI * 2);
    ctx.fill();
    addText(topo.ranks[r], kx + 14, keyY, font, "--ink");
    kx += ctx.measureText(topo.ranks[r]).width + 26;
  }
}

// One expert dot: idle (gray), picked (a ring while the token travels to it), working (solid, with a
// ring filling as it computes), or answered (dimmer, with a dashed ring while its result travels back).
// With a cache (TASK-41): ready (prefetched, a green ring), loading (a dashed drive-colored ring), or missed (a red ring).
function drawExpert(x, y, rad, rgb, state, done) {
  ctx.beginPath();
  ctx.arc(x, y, rad, 0, Math.PI * 2);
  ctx.fillStyle = state === "working" ? `rgb(${rgb})` : state === "answered" ? `rgba(${rgb}, 0.6)` : state === "ready" ? `rgba(${color("--ready")}, 0.22)` : color("--cell");
  ctx.fill();
  if (state === "ready" || state === "missed")
  {
    ctx.lineWidth = Math.max(1.5, rad * 0.3);
    ctx.strokeStyle = `rgb(${color(state === "ready" ? "--ready" : "--miss")})`;
    ctx.stroke();
  }
  else if (state === "loading")
  {
    ctx.beginPath();
    ctx.arc(x, y, rad + 2, 0, Math.PI * 2);
    ctx.setLineDash([3, 2]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = `rgb(${color("--drive")})`;
    ctx.stroke();
    ctx.setLineDash([]);
  }
  else if (state === "answered")
  {
    ctx.beginPath();
    ctx.arc(x, y, rad + 3, 0, Math.PI * 2);
    ctx.setLineDash([2, 2]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = `rgb(${rgb})`;
    ctx.stroke();
    ctx.setLineDash([]);
  }
  else if (state === "picked")
  {
    ctx.lineWidth = Math.max(1.5, rad * 0.3);
    ctx.strokeStyle = `rgb(${rgb})`;
    ctx.stroke();
  }
  else if (state === "working")
  {
    ctx.beginPath();
    ctx.arc(x, y, rad + 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * done);
    ctx.lineWidth = 2;
    ctx.strokeStyle = `rgb(${rgb})`;
    ctx.stroke();
  }
}

// A machine's NVMe drive, the expert cache's source (TASK-41).
function drawDrive(x, y, small) {
  const w = small ? 48 : 76, h = small ? 16 : 20;
  rrect(x - w / 2, y - h / 2, w, h, 4);
  ctx.fillStyle = `rgba(${color("--drive")}, 0.16)`;
  ctx.fill();
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = `rgb(${color("--drive")})`;
  ctx.stroke();
  addText(small ? "drive" : "NVMe drive", x, y + 4, "600 11px system-ui, sans-serif", "--ink", "center");
}

// An expert's weights on their way from the drive to its dot, `t` from 0 to 1.
function drawLoad(from, to, t, small) {
  const k = ease(Math.max(0, Math.min(1, t)));
  const rgb = color("--drive");
  ctx.strokeStyle = `rgba(${rgb}, 0.3)`;
  ctx.lineWidth = 1;
  strokePath([{ x: from.x, y: from.y - 6 }, to]);
  ctx.fillStyle = `rgb(${rgb})`;
  ctx.beginPath();
  ctx.arc(from.x + (to.x - from.x) * k, from.y - 6 + (to.y - from.y + 6) * k, small ? 2.6 : 3.6, 0, Math.PI * 2);
  ctx.fill();
}

// Each machine's color, shared by both views: rank 0 blue, then orange, purple and pink.
function rankRgb(r) {
  return color(r === 0 ? "--rank0" : `--rank${1 + (r - 1) % 3}`);
}

// The heading over the "One token" view, longest wording first: how much slower than the engine the animation runs.
function flowHeading(c) {
  if (!c)
  {
    return rp ? ["Each token climbs the layers, and in every layer the router sends it to a few experts", "Each token visits a few experts in every layer"] : ["Waiting for the next token"];
  }
  let ms = 0;
  for (let l = 0; l < topo.layers; l++)
  {
    ms += layerMs(c, l);
  }
  ms /= topo.layers;
  let slow = "Animation slowed down to follow one token";
  if (c.realUs > 0)
  {
    const x = ms * 1000 / c.realUs;
    const round = x >= 100 ? Number(x.toPrecision(2)) : Math.max(1, Math.round(x));
    slow = `Animation about ${round.toLocaleString()}× slower than real time`;
  }
  const lead = c.n > 1 ? `Reading the ${c.n.toLocaleString()}-token prompt at once · ` : "";
  const skip = c.skipped ? " · skipping tokens to keep up" : "";
  return [lead + slow + skip, slow + skip, slow];
}

const canvas = $("canvas");
const ctx = canvas.getContext("2d");
let last = performance.now();

function draw(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (rp) advanceReplay(dt);
  $("skipMap").hidden = true; // Each view shows its own again if it is drawn with a progress bar
  $("skipFlow").hidden = true;
  if (!topo) {
    ctx.fillStyle = color("--muted");
    ctx.font = "14px system-ui, sans-serif";
    ctx.fillText(rp !== null || showcase || traceUrl ? "" : "Waiting for the engine's live feed...", 20, 30);
    requestAnimationFrame(draw);
    return;
  }
  animTick(dt);
  labels.length = 0;
  showChatNote(rp && loadingFor === null ? stepInFlight() : null);
  if (bothViews.matches)
  {
    const split = Math.round(H * 0.42);
    drawHeat(W, split);
    ctx.fillStyle = color("--line");
    ctx.fillRect(0, split, W, 1);
    drawFlow(W, H - split - 1, split + 1);
  }
  else if (view === "flow")
  {
    drawFlow(W, H);
  }
  else
  {
    drawHeat(W, H);
  }
  drawLabels();
  requestAnimationFrame(draw);
}

// The "All experts" view: every expert of every layer in one grid, grouped by the machine that holds it,
// with the current token's path: the experts running now, and the ones it already used in lower layers.
function drawHeat(W, H) {
  const L = topo.layers, ranks = topo.ranks.length;
  const c = mapAnim.cur || mapAnim.recent;
  const cl = !c ? -1 : c === mapAnim.cur ? Math.min(c.l, L) : L; // A token not animated yet shows its whole path
  const small = W < 560, pad = 14;
  const font = "12px system-ui, sans-serif", bold = "600 12px system-ui, sans-serif", big = "600 15px system-ui, sans-serif";
  const shown = [];
  for (let r = 0; r < ranks; r++)
  {
    if (live.cols[r].length)
    {
      shown.push(r);
    }
  }
  const axis = small ? 44 : 60, gap = small ? 6 : 12;
  const left = pad + axis, right = W - pad;
  const top = pad + 78, bottom = H - pad - (small ? 70 : 62);
  const gaps = gap * (shown.length - 1), aw = right - left - gaps, ah = bottom - top;
  // Square cells. A model much too wide for its height folds each layer's experts onto a few short rows,
  // only when that makes the cells far bigger; cells may be under a pixel, and lit experts stay visible.
  let fold = 1, cw = 0;
  for (let f = 1; f <= 16; f++)
  {
    const across = shown.reduce((n, r) => n + Math.ceil(live.cols[r].length / f), 0);
    const s = Math.min(aw / across, (ah - (f > 1 ? L - 1 : 0)) / (L * f));
    if (s > cw * 1.5)
    {
      fold = f;
      cw = s;
    }
  }
  const ch = cw, lgap = fold > 1 ? 1 : 0; // A thin gap between layers once each spans several rows
  const per = (r) => Math.ceil(live.cols[r].length / fold);
  const across = shown.reduce((n, r) => n + per(r), 0);
  const layerH = ch * fold, gh = L * layerH + (L - 1) * lgap;
  const gx = left + (aw - cw * across) / 2, gy = top + (ah - gh) / 2;
  const rowY = (l) => gy + (L - 1 - l) * (layerH + lgap); // Layer 1 at the bottom, as the token climbs in the "One token" view
  const cellAt = (r, j) => ({ x: (j % per(r)) * cw, y: Math.floor(j / per(r)) * ch });

  // How many expert runs the token (or prompt) has made on each machine so far, out of its total.
  const done = new Array(ranks).fill(0);
  let total = 0;
  for (let l = 0; c && l < L; l++)
  {
    for (const p of c.layers[l])
    {
      total += p.c;
      if (l <= cl)
      {
        done[ownerOf(p.e)] += p.c;
      }
    }
  }

  ctx.font = big;
  const k = topo.top_k;
  const skip = c && c.skipped ? " · skipping tokens to keep up" : "";
  const prompt = c && c.n > 1 ? `Reading the ${c.n.toLocaleString()}-token prompt at once` : "";
  // Some models' first layers are dense and run no experts (GLM-5.3-Flash's first 3).
  const ml = c ? c.layers.filter((p) => p.length > 0).length : L;
  const where = ml < L ? `${ml} of its ${L} layers` : `${L} layers`;
  const heads = !c ? ["Every expert of every layer, grouped by the machine that holds it", "Every expert of every layer"]
    : prompt ? [`${prompt}: each token runs ${k} experts in each of ${where}${skip}`, prompt]
    : [`Each token runs ${k} experts in each of ${where}, ${(k * ml).toLocaleString()} in all${skip}`, `${k} experts in each of ${where}, ${(k * ml).toLocaleString()} per token`, `${k} experts per layer`];
  addText(heads.find((t) => ctx.measureText(t).width <= W - 2 * pad) || "", W / 2, pad + 12, big, "--ink", "center");
  drawStepNote(animNote(mapAnim, mapLayerMs), W / 2, pad + 34, W - 2 * pad, $("skipMap"));

  // Each machine's band of columns: its name above, its expert range and share of the token's work below.
  const cellBg = color("--cell"), ink = color("--ink");
  const counts = (n) => {
    const a = n.toLocaleString(), b = total.toLocaleString();
    return c && c.n > 1 ? [`${a} of ${b} expert runs here`, `${a} of ${b}`, a] : [`${a} of ${b} experts ran here`, `${a} of ${b} ran here`, `${a} of ${b}`, a];
  };
  const names = [], ranges = [];
  for (const r of shown)
  {
    const ids = live.cols[r];
    names.push([`rank ${r} · ${topo.ranks[r]}`, topo.ranks[r], `rank ${r}`]);
    const contiguous = ids[ids.length - 1] - ids[0] === ids.length - 1;
    ranges.push(contiguous ? [`experts ${ids[0]} to ${ids[ids.length - 1]}`, `${ids[0]} to ${ids[ids.length - 1]}`, ""] : [`${ids.length} experts`, ""]);
  }
  // Each row of labels takes the longest wording that fits every machine, so the machines read alike.
  const level = (f, lists) => {
    ctx.font = f;
    let worst = 0;
    lists.forEach((options, b) => {
      const w = per(shown[b]) * cw + gap / 2;
      const i = options.findIndex((t) => ctx.measureText(t).width <= w);
      worst = Math.max(worst, i < 0 ? options.length - 1 : i);
    });
    return worst;
  };
  const nameAt = level(bold, names), rangeAt = level(font, ranges);
  const countAt = c ? level(bold, shown.map(() => counts(total))) : 0; // Measured at the full count, so the wording holds as it grows
  const bands = [];
  let x = gx;
  shown.forEach((r, b) => {
    const ids = live.cols[r], bw = per(r) * cw;
    const inset = cw >= 3 && ch >= 3 ? 0.4 : 0;
    bands[r] = x;
    ctx.fillStyle = `rgb(${rankRgb(r)})`;
    ctx.fillRect(x, gy - 12, bw, 3);
    addText(names[b][Math.min(nameAt, names[b].length - 1)], x + bw / 2, gy - 18, bold, "--ink", "center");
    ctx.fillStyle = cellBg;
    for (let l = 0; l < L; l++)
    {
      for (let j = 0; j < ids.length; j++)
      {
        const at = cellAt(r, j);
        ctx.fillRect(x + at.x + inset, rowY(l) + at.y + inset, cw - 2 * inset, ch - 2 * inset);
      }
    }
    addText(ranges[b][Math.min(rangeAt, ranges[b].length - 1)], x + bw / 2, gy + gh + 16, font, "--muted", "center");
    if (c)
    {
      addText(counts(done[r])[countAt], x + bw / 2, gy + gh + 34, bold, "--ink", "center");
    }
    x += bw + gap;
  });

  // The token's path: the layers it has passed, then the layer it is in now, outlined.
  for (let l = 0; c && l <= Math.min(cl, L - 1); l++)
  {
    const picks = c.layers[l], now = l === cl && c === mapAnim.cur;
    for (const p of picks)
    {
      const r = ownerOf(p.e);
      if (bands[r] === undefined)
      {
        continue;
      }
      const at = cellAt(r, live.colOf[p.e]);
      const cx = bands[r] + at.x, cy = rowY(l) + at.y;
      const sw = Math.max(cw, 1.5), sh = Math.max(ch, 1.5);
      ctx.fillStyle = `rgba(${rankRgb(r)}, ${now ? 1 : 0.45})`; // One shade for every expert that ran, however many of a prompt's tokens chose it
      ctx.fillRect(cx, cy, sw, sh);
      if (now)
      {
        ctx.strokeStyle = ink;
        ctx.lineWidth = 1;
        ctx.strokeRect(cx - 0.5, cy - 0.5, sw + 1, sh + 1);
      }
    }
  }

  // The layer axis, with the token's current layer marked as in the "One token" view.
  const mid = (l) => rowY(l) + layerH / 2 + 4;
  const marked = c === mapAnim.cur && cl >= 0 && cl < L;
  if (!marked || cl < L - 2)
  {
    addText(`layer ${L}`, gx - 8, mid(L - 1), font, "--muted", "right");
  }
  if (!marked || cl > 1)
  {
    addText("layer 1", gx - 8, mid(0), font, "--muted", "right");
  }
  if (marked)
  {
    ctx.fillStyle = `rgb(${color("--now")})`;
    ctx.fillRect(gx - 5, rowY(cl), 3, Math.max(layerH, 2));
    addText(`layer ${cl + 1}`, gx - 8, mid(cl), bold, "--ink", "right");
  }

  // A key for the squares.
  const keyY = H - pad - 4, sq = 10;
  const used = c && c.n > 1 ? "this prompt already used it" : "this token already used it";
  const items = [["idle", "one expert in one layer", "an expert"], ["now", "running now", "running"], ["used", used, "already used"]];
  ctx.font = font;
  const long = items.reduce((w, it) => w + sq + 22 + ctx.measureText(it[1]).width, 0) <= W - 2 * pad;
  const keyRgb = rankRgb(shown.length ? shown[0] : 0);
  let kx = pad;
  for (const [kind, text, short] of items)
  {
    ctx.fillStyle = kind === "idle" ? cellBg : `rgba(${keyRgb}, ${kind === "now" ? 1 : 0.45})`;
    ctx.fillRect(kx, keyY - sq + 1, sq, sq);
    if (kind === "now")
    {
      ctx.strokeStyle = ink;
      ctx.lineWidth = 1;
      ctx.strokeRect(kx - 0.5, keyY - sq + 0.5, sq + 1, sq + 1);
    }
    const t = long ? text : short;
    ctx.font = font;
    addText(t, kx + sq + 6, keyY, font, "--ink");
    kx += sq + 22 + ctx.measureText(t).width;
  }
}

// How far a view's animation is through its current step, on that view's own clock and speed.
function animNote(a, msOf) {
  const c = a.cur;
  if (!c || c.l >= topo.layers)
  {
    return null;
  }
  let total = 0, done = 0;
  for (let l = 0; l < topo.layers; l++)
  {
    const ms = msOf(c, l);
    total += ms;
    if (l < c.l)
    {
      done += ms;
    }
  }
  done += c.u * msOf(c, c.l);
  if (total < 1000)
  {
    return null; // A step this quick needs no progress bar
  }
  const what = c.n > 1 ? `Reading the ${c.n.toLocaleString()}-token prompt` : c.word ? `Token “${shownWord(c.word)}”` : "Working on the next token";
  return {
    text: `${what}... layer ${c.l + 1} of ${topo.layers} · ${(done / 1000).toFixed(1)} of ${(total / 1000).toFixed(1)} s`,
    frac: Math.min(1, done / total),
    skip: c.n > 1 ? "Skip reading" : "Skip token",
  };
}

// Ends a view's current step at once: its whole path shows, and the next step follows on that view's clock.
function skipAnim(a) {
  const c = a.cur;
  if (c && c.l < topo.layers)
  {
    c.l = topo.layers;
    c.u = 0;
    c.out = 0;
  }
}

// A view's status under its heading: what it is on, its time so far, a thin progress bar, and its skip button.
function drawStepNote(note, cx, y, maxW, btn) {
  if (!note)
  {
    btn.hidden = true;
    return;
  }
  const font = "12px system-ui, sans-serif";
  ctx.font = font;
  if (btn.textContent !== note.skip)
  {
    btn.textContent = note.skip;
  }
  btn.hidden = false;
  const gap = 8, bw0 = btn.offsetWidth || 90;
  const room = maxW - bw0 - gap;
  const text = ctx.measureText(note.text).width <= room ? note.text : note.text.replace(/^[^.]*\.\.\. /, "");
  const tw = ctx.measureText(text).width;
  const left = cx - (tw + gap + bw0) / 2; // The text and its button, centered together
  addText(text, left + tw / 2, y, font, "--muted", "center");
  btn.style.left = `${Math.round(left + tw + gap)}px`;
  btn.style.top = `${Math.round(y - 15)}px`;
  const bw = Math.min(200, maxW);
  ctx.fillStyle = color("--cell");
  ctx.fillRect(cx - bw / 2, y + 6, bw, 3);
  ctx.fillStyle = `rgb(${color("--now")})`;
  ctx.fillRect(cx - bw / 2, y + 6, bw * note.frac, 3);
}

// The chat's own status, on the replay's clock: a bubble at the end of the conversation while a slow step plays.
function showChatNote(pending) {
  let el = $("chatNote");
  if (!pending)
  {
    el?.remove();
    return;
  }
  if (!el)
  {
    el = document.createElement("div");
    el.id = "chatNote";
    el.className = "msg status";
    el.innerHTML = '<div class="row"><span class="dots"><i></i><i></i><i></i></span><span class="what"></span><button type="button" class="skip"></button></div><div class="bar"><div></div></div>';
    el.querySelector(".skip").addEventListener("click", skipChat);
  }
  const label = pending.v.n > 1 ? "Skip reading" : "Skip token";
  const btn = el.querySelector(".skip");
  if (btn.textContent !== label)
  {
    btn.textContent = label;
  }
  if (el !== $("log").lastElementChild)
  {
    $("log").appendChild(el);
    toBottom();
  }
  const what = pending.v.n > 1 ? `Reading the ${pending.v.n.toLocaleString()}-token prompt` : "Working on the next token";
  const done = rp.clock - pending.start, total = pending.t - pending.start;
  const text = `${what}... ${(done / 1000).toFixed(1)} of ${(total / 1000).toFixed(1)} s`;
  const span = el.querySelector(".what");
  if (span.textContent !== text)
  {
    span.textContent = text;
  }
  el.querySelector(".bar > div").style.width = `${(Math.min(1, done / total) * 100).toFixed(1)}%`;
}

// Diagram text, drawn after everything else on a small backdrop so lines and packets never cover it.
const labels = [];
const textShift = { x: 0, y: 0 };
function addText(text, x, y, font, fill, align = "left") {
  labels.push({ text, x: x + textShift.x, y: y + textShift.y, font, fill, align });
}

function drawLabels() {
  const back = color("--panel");
  for (const l of labels) {
    ctx.font = l.font;
    const m = ctx.measureText(l.text);
    const up = m.fontBoundingBoxAscent ?? m.actualBoundingBoxAscent, down = m.fontBoundingBoxDescent ?? m.actualBoundingBoxDescent;
    const left = l.align === "center" ? l.x - m.width / 2 : l.align === "right" ? l.x - m.width : l.x;
    ctx.globalAlpha = 0.88;
    ctx.fillStyle = back;
    ctx.beginPath();
    if (ctx.roundRect)
    {
      ctx.roundRect(left - 4, l.y - up - 2, m.width + 8, up + down + 4, 4);
    }
    else
    {
      ctx.rect(left - 4, l.y - up - 2, m.width + 8, up + down + 4);
    }
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = color(l.fill);
    ctx.textAlign = l.align;
    ctx.fillText(l.text, l.x, l.y);
  }
  ctx.textAlign = "left";
}

// Where `u` (0 to 1) falls along a path of points, nudged `off` pixels sideways.
function pointAt(path, u, off) {
  let total = 0;
  for (let i = 1; i < path.length; i++) total += Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y);
  let left = u * total;
  for (let i = 1; i < path.length; i++) {
    const p = path[i - 1], q = path[i];
    const len = Math.hypot(q.x - p.x, q.y - p.y);
    if (left <= len || i === path.length - 1) {
      const k = len ? Math.min(1, left / len) : 0, d = len || 1;
      return { x: p.x + (q.x - p.x) * k - ((q.y - p.y) / d) * off, y: p.y + (q.y - p.y) * k + ((q.x - p.x) / d) * off };
    }
    left -= len;
  }
  return path[0];
}

function stat(k, v, s, cls) {
  return `<div class="stat"><div class="k">${k}</div><div class="v ${cls || ""}">${v}</div><div class="s">${s || ""}</div></div>`;
}

function renderStats() {
  if (!live) { $("stats").innerHTML = ""; return; }
  const d = live.decode;
  const tps = d.length > 1 ? (d.length - 1) / ((d[d.length - 1] - d[0]) / 1000) : 0;
  const out = [];
  out.push(stat("decode", tps ? `${tps.toFixed(1)} tokens/s` : "idle", live.prefill ? `last prefill: ${live.prefill.n} tokens in ${live.prefill.ms.toFixed(0)} ms` : "no prefill yet"));
  for (let r = 0; r < topo.ranks.length; r++) {
    const eng = live.engine && live.base && live.engine[r] !== null && live.base[r] !== null ? live.engine[r] - live.base[r] : null;
    let line, cls = "";
    if (eng === null) line = "the engine keeps no count of its own here";
    else if (live.gapAfterFirst) line = `engine counted ${eng.toLocaleString()}; frames were dropped, so no comparison`;
    else if (eng === live.drawn[r]) { line = `matches the engine's own count`; cls = "good"; }
    else { line = `engine counted ${eng.toLocaleString()}`; cls = "warn"; }
    out.push(stat(`rank ${r} expert calls`, live.drawn[r].toLocaleString(), line, cls));
  }
  if (live.cache && live.cache0) {
    const c = live.cache, c0 = live.cache0;
    const calls = (c.resident + c.hinted + c.late + c.missed) - (c0.resident + c0.hinted + c0.late + c0.missed);
    const hits = (c.resident + c.hinted) - (c0.resident + c0.hinted);
    out.push(stat("expert cache (rank 0)", calls ? `${(100 * hits / calls).toFixed(1)}% hits` : "no calls yet",
      `${(c.missed - c0.missed).toLocaleString()} misses, ${(c.late - c0.late).toLocaleString()} late, ${(c.loads - c0.loads).toLocaleString()} loads`));
  }
  if (rp) {
    out.push(stat("recording", `${live.frames.toLocaleString()} of ${rp.steps.toLocaleString()} steps`,
      `${live.dropped} dropped while recording · ${rp.rejected + live.rejected} lines rejected${rp.truncated ? " · file ends mid-line" : ""}`,
      live.dropped || rp.rejected || live.rejected ? "warn" : ""));
    $("clock").textContent = `${(rp.clock / 1000).toFixed(1)} / ${(rp.duration / 1000).toFixed(1)} s`;
    if (!rp.dragging) $("scrub").value = rp.duration ? Math.round(1000 * rp.clock / rp.duration) : 0;
  } else {
    out.push(stat("live feed", `${live.frames.toLocaleString()} frames`,
      `${live.dropped} dropped · ${live.rejected} rejected · ${Math.max(0, live.delay).toFixed(0)} ms behind`, live.dropped || live.rejected ? "warn" : ""));
  }
  $("stats").innerHTML = out.join("");
}

// Chat
const history = [];
let busy = null;

// Replies in a safe subset of Markdown: the text is escaped first, so only the tags made here can appear.
function markdown(src) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  // Inline code is kept apart first, so nothing inside it is read as emphasis or a link.
  const inline = (s) => s.split(/(`[^`\n]+`)/).map((part, i) => {
    if (i % 2 === 1)
    {
      return `<code>${esc(part.slice(1, -1))}</code>`;
    }
    return esc(part)
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*(?=\S)([^*]*?\S)\*\*/g, "<strong>$1</strong>")
      .replace(/__(?=\S)([^_]*?\S)__/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*(?=\S)([^*]*?\S)\*(?![*\w])/g, "$1<em>$2</em>");
  }).join("");
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let para = [], list = null;
  const flush = () => {
    if (para.length)
    {
      out.push(`<p>${para.map(inline).join("<br>")}</p>`);
      para = [];
    }
    if (list)
    {
      out.push(`<${list.tag}>${list.items.map((item) => `<li>${inline(item)}</li>`).join("")}</${list.tag}>`);
      list = null;
    }
  };
  for (let i = 0; i < lines.length; i++)
  {
    const line = lines[i];
    let m;
    if (/^\s*```/.test(line))
    {
      // A code block still streaming in has no closing fence yet, and runs to the end.
      flush();
      const code = [];
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++)
      {
        code.push(lines[i]);
      }
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
    }
    else if (!line.trim())
    {
      flush();
    }
    else if ((m = line.match(/^\s{0,3}(#{1,6})\s+(.*)$/)))
    {
      flush();
      const level = Math.min(5, m[1].length + 2);
      out.push(`<h${level}>${inline(m[2])}</h${level}>`);
    }
    else if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line))
    {
      flush();
      out.push("<hr>");
    }
    else if ((m = line.match(/^\s*([-*+]|\d+[.)])\s+(.*)$/)))
    {
      const tag = /\d/.test(m[1]) ? "ol" : "ul";
      if (para.length || (list && list.tag !== tag))
      {
        flush();
      }
      if (!list)
      {
        list = { tag, items: [] };
      }
      list.items.push(m[2]);
    }
    else if ((m = line.match(/^\s*>\s?(.*)$/)))
    {
      flush();
      out.push(`<blockquote>${inline(m[1])}</blockquote>`);
    }
    else if (list && /^\s+\S/.test(line))
    {
      list.items[list.items.length - 1] += " " + line.trim(); // An indented line continues the item above
    }
    else
    {
      if (list)
      {
        flush();
      }
      para.push(line);
    }
  }
  flush();
  return out.join("");
}

// The log follows new text while its reader is at the bottom, and stays put once they scroll up to read.
let followLog = true;
$("log").addEventListener("scroll", () => {
  const log = $("log");
  followLog = log.scrollHeight - log.scrollTop - log.clientHeight < 48;
});

function toBottom() {
  if (followLog)
  {
    $("log").scrollTop = $("log").scrollHeight;
  }
}

// `place` is the log, or the pinned area above it for notes about the recording.
function addMsg(role, text, place = $("log")) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  place.appendChild(el);
  toBottom();
  return el;
}

// A finished assistant message, in Markdown.
function addReplyText(text) {
  const el = addMsg("assistant", "");
  const body = document.createElement("div");
  body.className = "md";
  body.innerHTML = markdown(text);
  el.appendChild(body);
  toBottom();
  return el;
}

// An assistant reply that fills in as text arrives, with its reasoning folded apart.
function makeReply() {
  const el = addMsg("assistant", "");
  const think = document.createElement("details");
  think.className = "think";
  think.open = true;
  think.innerHTML = "<summary>thinking</summary>";
  const thinkText = document.createElement("div");
  think.appendChild(thinkText);
  const body = document.createElement("div");
  body.className = "md";
  el.appendChild(body);
  const foot = document.createElement("div");
  foot.className = "foot";
  el.appendChild(foot);
  const r = {
    el, body, foot, content: "", reasoning: "",
    add(channel, text) {
      if (channel === "reasoning") {
        r.reasoning += text;
        if (!think.parentNode) el.insertBefore(think, body);
        thinkText.textContent = r.reasoning;
      } else {
        r.content += text;
        body.innerHTML = markdown(r.content);
        if (think.parentNode && think.open && r.content.trim()) think.open = false;
      }
      toBottom();
    },
    footer(s, finish) {
      foot.textContent = `${s.completion_tokens ?? "?"} tokens · first token ${Number(s.ttft_ms).toFixed(0)} ms · ${Number(s.decode_tokens_per_s).toFixed(1)} tokens/s` +
        (s.cached_tokens ? ` · ${s.cached_tokens} prompt tokens reused` : "") + (finish && finish !== "stop" ? ` · stopped: ${finish}` : "");
    },
  };
  return r;
}

async function send(text) {
  history.push({ role: "user", content: text });
  addMsg("user", text);
  const reply = makeReply();
  const { el, body, foot } = reply;
  let extra = null, finish = null;
  busy = new AbortController();
  setBusy(true);
  const req = {
    messages: history,
    stream: true,
    stream_options: { include_usage: true },
    max_tokens: Math.max(1, parseInt($("max").value, 10) || 512),
    temperature: Math.max(0, parseFloat($("temp").value) || 0),
  };
  if (!$("thinkbox").hidden) req.chat_template_kwargs = { enable_thinking: $("think").checked };
  try {
    const res = await fetch("/v1/chat/completions", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(req), signal: busy.signal,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => null);
      throw new Error(err?.error?.message || `HTTP ${res.status}`);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line.startsWith("data: ") || line === "data: [DONE]") continue;
        const chunk = JSON.parse(line.slice(6));
        if (chunk.error) throw new Error(chunk.error.message);
        const ch = chunk.choices?.[0];
        if (ch) {
          if (ch.delta?.reasoning_content) reply.add("reasoning", ch.delta.reasoning_content);
          if (ch.delta?.content) reply.add("content", ch.delta.content);
          if (ch.finish_reason) finish = ch.finish_reason;
        }
        if (chunk.tensorfold) extra = { ...chunk.tensorfold, completion_tokens: chunk.usage?.completion_tokens };
      }
    }
    const { content, reasoning } = reply;
    history.push({ role: "assistant", content, ...(reasoning ? { reasoning_content: reasoning } : {}) });
    if (extra) reply.footer(extra, finish);
  } catch (e) {
    if (e.name === "AbortError") {
      history.push({ role: "assistant", content: reply.content });
      foot.textContent = "stopped";
    } else {
      history.pop();
      el.classList.add("error");
      body.textContent = (reply.content ? reply.content + "\n" : "") + "Error: " + e.message;
    }
  } finally {
    busy = null;
    setBusy(false);
  }
}

function setBusy(on) {
  $("send").textContent = on ? "Stop" : "Send";
  $("send").classList.toggle("stop", on);
}

$("form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  if (busy) { busy.abort(); return; }
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  send(text);
});
$("input").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
    ev.preventDefault();
    $("form").requestSubmit();
  }
});

// The box covers the diagram while a recording downloads and is read; a slow replay step shows inside the diagram.
let loadingFor = null;
function setLoading(text) {
  loadingFor = text;
  $("loading").hidden = text === null;
  if (text !== null && $("loadmsg").textContent !== text) {
    $("loadmsg").textContent = text;
  }
}

function mb(bytes) {
  return bytes < 1e6 ? `${Math.round(bytes / 1e3)} KB` : `${(bytes / 1e6).toFixed(1)} MB`;
}

// Downloads `url` with the spinner up, counting the bytes when the server says how many there are.
async function fetchBlob(url, what) {
  setLoading(`Loading ${what}...`);
  const res = await fetch(url);
  if (!res.ok) {
    throw new Error(`HTTP ${res.status}`);
  }
  const total = Number(res.headers.get("content-length")) || 0;
  if (!total || !res.body) {
    return await res.blob();
  }
  const reader = res.body.getReader();
  const parts = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) {
      break;
    }
    parts.push(value);
    got += value.length;
    setLoading(got <= total ? `Loading ${what}... ${mb(got)} of ${mb(total)}` : `Loading ${what}... ${mb(got)}`); // A compressed response counts more bytes than it says
  }
  return new Blob(parts);
}

// Replay (TASK-16): a recording is the live feed's frames, one per line, with the chat's notes among them.
async function readText(blob) {
  const head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
  if (head[0] === 0x1f && head[1] === 0x8b) {
    return await new Response(blob.stream().pipeThrough(new DecompressionStream("gzip"))).text();
  }
  return await blob.text();
}

function parseTrace(text) {
  const lines = text.split("\n");
  while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
  if (!lines.length) throw new Error("the file is empty");
  let hello;
  try { hello = JSON.parse(lines[0]); } catch { throw new Error("its first line is not JSON"); }
  if (!hello || hello.t !== "hello" || !validHello(hello)) throw new Error("it does not start with a TensorFold hello line");
  const items = [];
  let rejected = 0, truncated = false, steps = 0;
  for (let i = 1; i < lines.length; i++) {
    let v;
    try { v = JSON.parse(lines[i]); } catch {
      if (i === lines.length - 1) truncated = true; else rejected++;
      continue;
    }
    if (!v || typeof v !== "object") { rejected++; continue; }
    if (v.t === "step") {
      if (!validStep(v) || !stepInRange(v, hello) || !(typeof v.step_us === "number" && v.step_us >= 0)) { rejected++; continue; }
      steps++;
      items.push({ step: true, v });
    } else if (["chat", "text", "done", "end"].includes(v.t)) {
      if (v.t === "chat" && !(Array.isArray(v.messages) && v.messages.every((m) => m && typeof m.content === "string"))) { rejected++; continue; }
      if (v.t === "text" && typeof v.s !== "string") { rejected++; continue; }
      items.push({ step: false, v });
    }
  }
  if (!steps) throw new Error("it holds no engine steps");
  // Each step's token, from the text that became visible after it.
  const words = new Map();
  for (const it of items)
  {
    if (!it.step && it.v.t === "text" && Number.isInteger(it.v.after))
    {
      words.set(it.v.after, (words.get(it.v.after) || "") + it.v.s);
    }
  }
  for (const it of items)
  {
    if (it.step)
    {
      it.word = words.get(it.v.seq) || "";
    }
  }
  // Recording time, with idle stretches between requests cut to a second.
  let t = 0, prevEnd = null;
  for (const it of items) {
    if (!it.step) continue;
    const dur = it.v.step_us / 1000, start = it.v.ms - dur;
    const gap = prevEnd === null ? 0 : start - prevEnd;
    it.start = (prevEnd === null ? 0 : t) + (gap > 1500 ? 1000 : Math.max(0, gap));
    it.t = it.start + dur;
    t = it.t;
    prevEnd = it.v.ms;
  }
  // A request appears as its prefill starts; other notes right after the step before them.
  let next = t;
  for (let i = items.length - 1; i >= 0; i--) {
    if (items[i].step) next = items[i].start;
    else if (items[i].v.t === "chat") items[i].t = next;
  }
  let last = 0;
  for (const it of items) {
    if (it.t === undefined) it.t = last;
    last = it.t = Math.max(it.t, last);
  }
  return { hello, items, steps, rejected, truncated, duration: last, chats: items.some((it) => it.v.t === "chat") };
}

async function loadTrace(name, blob) {
  let trace;
  try {
    trace = parseTrace(await readText(blob));
  } catch (e) {
    showProblem(`${name} is not a TensorFold recording: ${e.message}.`);
    return;
  }
  startReplay(name, trace, null);
}

// The public site's list of recordings, each with a label saying where and how it was recorded.
async function startShowcase() {
  document.querySelector("header h1").textContent = "TensorFold-Swarm";
  $("form").hidden = true;
  $("dot").hidden = true;
  $("conn").textContent = "loading the recording";
  $("empty").textContent = "Loading the recording...";
  for (const id of ["badge", "inspector", "repo"]) {
    $(id).hidden = false;
  }
  let list;
  try {
    list = JSON.parse(await (await fetchBlob(showcase, "the list of recordings")).text()).recordings;
    if (!Array.isArray(list) || !list.length || !list.every((r) => r && typeof r.file === "string" && typeof r.title === "string")) {
      throw new Error("it lists no recordings");
    }
  } catch (e) {
    setLoading(null);
    showProblem(`Could not load the list of recordings: ${e.message}.`);
    return;
  }
  const pick = $("pick");
  list.forEach((rec, i) => {
    const o = document.createElement("option");
    o.value = String(i);
    o.textContent = rec.title;
    pick.appendChild(o);
  });
  pick.hidden = false;
  const want = new URLSearchParams(location.search).get("r");
  const at = Math.max(0, list.findIndex((rec) => rec.id === want));
  pick.value = String(at);
  pick.addEventListener("change", () => openRecording(list[Number(pick.value)], true));
  openRecording(list[at], false);
}

let opening = 0;
async function openRecording(rec, chosen) {
  const ticket = ++opening;
  if (chosen && rec.id) {
    window.history.replaceState(null, "", `?r=${encodeURIComponent(rec.id)}`);
  }
  let trace;
  try {
    const blob = await fetchBlob(rec.file, "the recording");
    if (ticket !== opening) {
      return;
    }
    setLoading("Reading the recording...");
    trace = parseTrace(await readText(blob));
  } catch (e) {
    if (ticket === opening) {
      setLoading(null);
      showProblem(`Could not replay "${rec.title}": ${e.message}.`);
    }
    return;
  }
  if (ticket === opening) {
    setLoading(null);
    startReplay(rec.file.split("/").pop(), trace, rec);
  }
}

function addLabel(label) {
  const el = addMsg("note", label.summary ? label.summary + " " : "", $("pinned"));
  if (label.results) {
    const a = document.createElement("a");
    a.href = label.results;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "Raw results and how it was recorded";
    el.appendChild(a);
  }
}

function showProblem(text) {
  $("empty")?.remove();
  const el = addMsg("note error", text);
  el.classList.add("error");
}

// `label` describes a recording from the public site's list, and may name its machines more plainly than the file does.
function startReplay(name, trace, label) {
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  const speed = label && REAL_SPEEDS.includes(String(label.speed)) ? Number(label.speed) : 1;
  rp = { ...trace, name, label, i: 0, clock: 0, speed, playing: true, dragging: false, reply: null, shown: 0 };
  fillSpeeds();
  const ranks = label && Array.isArray(label.ranks) && label.ranks.length === trace.hello.ranks.length ? label.ranks : trace.hello.ranks;
  topo = { ...trace.hello, ranks };
  $("dot").classList.remove("on");
  const date = trace.hello.recorded ? new Date(trace.hello.recorded * 1000) : null;
  if (label) {
    const day = date ? ` on ${date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" })}` : "";
    $("conn").textContent = `recorded${day}, replayed in your browser with no engine connected`;
  } else {
    $("conn").textContent = `replaying ${name}, recorded${date ? ` on ${date.toLocaleString()}` : ""}`;
  }
  $("model").textContent = `${topo.model} · ${topo.layers} layers × ${topo.experts} experts, top ${topo.top_k} · ${topo.transport}`;
  $("form").hidden = true;
  $("player").hidden = false;
  $("golive").hidden = showcase !== null || !/^https?:$/.test(location.protocol) || new URLSearchParams(location.search).has("trace");
  seekReplay(0);
