name: Deploy inspector to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Reject executables and installers (web delivery is sandboxed only)
        run: |
          bad=$(find dist -type f \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.pkg' -o -iname '*.msi' -o -iname '*.sh' -o -iname '*.bat' -o -iname '*.ps1' -o -iname '*.app' -o -iname '*.deb' -o -iname '*.rpm' \))
          if [ -n "$bad" ]; then echo "Executable or installer found in bundle:"; echo "$bad"; exit 1; fi
          echo "Bundle size: $(du -sh dist | cut -f1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
