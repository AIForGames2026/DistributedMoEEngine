name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine (zig build test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install liburing
        run: sudo apt-get update && sudo apt-get install -y liburing-dev
      - name: Unit tests (x86_64)
        run: zig build test --summary all
      - name: io_uring reader test
        run: zig build io-test --summary all
      - name: Run
        run: zig build run
      - name: Start-to-first-kernel time (< 5 ms)
        run: zig build startup -Doptimize=ReleaseFast
      - name: Dispatch check (shared memory and TCP loopback)
        run: |
          zig build install -Doptimize=ReleaseFast
          zig-out/bin/dispatch shm
          zig-out/bin/dispatch expert --port 7470 &
          zig-out/bin/dispatch router --host 127.0.0.1 --port 7470
          wait
      - name: Cross-compile for DGX Spark (aarch64)
        run: zig build -Dtarget=aarch64-linux-gnu

  inspector:
    name: Inspector (web build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Trace generator check (schema v0, 10,000-packet stress trace)
        run: npm test
      - run: npm run build
