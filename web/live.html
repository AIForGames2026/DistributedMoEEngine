<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TensorFold Live</title>
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --ink: #1b1f24;
  --muted: #5f6b7a;
  --line: #dde2e8;
  --cell: #eceff3;
  --rank0: 37, 99, 235;
  --rank1: 234, 88, 12;
  --ok: #15803d;
  --bad: #b91c1c;
  --user: #e8eefc;
  --think: #f1f3f5;
  --radius: 10px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --ink: #e6e9ed;
    --muted: #93a0b0;
    --line: #2a313a;
    --cell: #222831;
    --rank0: 96, 145, 255;
    --rank1: 251, 146, 60;
    --ok: #4ade80;
    --bad: #f87171;
    --user: #1f2a44;
    --think: #1d2229;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
header { display: flex; gap: 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
header .meta { color: var(--muted); font-size: 13px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 6px; vertical-align: middle; }
.dot.on { background: var(--ok); }
main { flex: 1; display: grid; grid-template-columns: minmax(320px, 420px) 1fr; min-height: 0; }
#chat { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; background: var(--panel); }
#log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 100%; white-space: pre-wrap; word-wrap: break-word; line-height: 1.45; font-size: 14px; }
.msg.user { align-self: flex-end; background: var(--user); padding: 8px 12px; border-radius: var(--radius); max-width: 85%; }
.msg.assistant .think { background: var(--think); color: var(--muted); padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
.msg.assistant .think summary { cursor: pointer; user-select: none; }
.msg .foot { color: var(--muted); font-size: 12px; margin-top: 4px; }
.msg.error { color: var(--bad); }
.empty { color: var(--muted); font-size: 14px; margin: auto; text-align: center; max-width: 280px; }
form { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
textarea { width: 100%; resize: none; min-height: 64px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.row label { display: flex; gap: 4px; align-items: center; }
.row input[type=number] { width: 68px; padding: 3px 5px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
button { padding: 7px 16px; border-radius: 8px; border: 0; background: rgb(var(--rank0)); color: #fff; font-weight: 600; cursor: pointer; margin-left: auto; }
button.stop { background: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
#view { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
#stage { flex: 1; position: relative; min-height: 240px; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.stat { background: var(--panel); padding: 10px 14px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat .s { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.good { color: var(--ok); }
.warn { color: var(--bad); }
.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); margin-left: 0; font-weight: 500; padding: 5px 12px; }
.ghost:hover { background: var(--cell); }
header .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
label.ghost { border-radius: 8px; cursor: pointer; font-size: 13px; }
a.ghost { border-radius: 8px; font-size: 13px; text-decoration: none; }
#pick { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; max-width: 360px; }
.badge { background: var(--user); color: var(--ink); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
.msg.note a { color: rgb(var(--rank0)); }
@media (max-width: 640px) {
  header .tools { margin-left: 0; flex-wrap: wrap; }
  #pick { max-width: 100%; flex: 1 1 100%; }
}
#player { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--panel); font-size: 13px; color: var(--muted); flex-wrap: wrap; }
#player input[type=range] { flex: 1; min-width: 140px; }
#player select { padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
#clock { font-variant-numeric: tabular-nums; min-width: 120px; text-align: right; }
.msg.note { color: var(--muted); font-size: 13px; }
body.dragging main { outline: 3px dashed rgb(var(--rank0)); outline-offset: -6px; }
@media (max-width: 800px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(300px, 1fr) minmax(360px, 1fr); }
  #chat { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <h1>TensorFold Live</h1>
  <span class="badge" id="badge" hidden>Recording of the real engine</span>
  <span class="meta"><span id="dot" class="dot"></span><span id="conn">connecting to the engine</span></span>
  <span class="meta" id="model"></span>
  <span class="tools">
    <select id="pick" aria-label="recording" hidden></select>
    <a id="inspector" class="ghost" href="inspector.html" hidden>3D inspector</a>
    <a id="repo" class="ghost" href="https://github.com/AIForGames2026/DistributedMoEEngine" hidden>Source</a>
    <button id="golive" class="ghost" type="button" hidden>Back to live</button>
    <label class="ghost">Replay a recording<input type="file" id="file" accept=".jsonl,.gz,.json,.txt" hidden></label>
  </span>
</header>
<main>
  <section id="chat">
    <div id="log"><div class="empty" id="empty">Send a message. Each token's experts light up on the machine that ran them.</div></div>
    <form id="form">
      <textarea id="input" placeholder="Message the model (Enter sends, Shift+Enter for a new line)"></textarea>
      <div class="row">
        <label>max tokens <input type="number" id="max" value="512" min="1" max="32768"></label>
        <label>temperature <input type="number" id="temp" value="0" min="0" max="2" step="0.1"></label>
        <label id="thinkbox" hidden><input type="checkbox" id="think" checked> thinking</label>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
  </section>
  <section id="view">
    <div id="stage"><canvas id="canvas"></canvas></div>
    <div id="player" hidden>
      <button id="play" class="ghost" type="button">Pause</button>
      <select id="speed" aria-label="replay speed">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option>
        <option value="2">2×</option><option value="4">4×</option><option value="10">10×</option>
      </select>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="replay position">
      <span id="clock">0.0 / 0.0 s</span>
    </div>
    <div id="stats"></div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const css = getComputedStyle(document.documentElement);
const color = (name) => css.getPropertyValue(name).trim();

// Everything the diagram knows, reset on each new connection.
let topo = null;
let live = null;
// The recording being replayed, if any (TASK-16).
let rp = null;
let ws = null;
// On the public site (TASK-18) the page never connects to an engine and replays only the recordings this manifest lists.
const showcase = document.querySelector('meta[name="tensorfold-showcase"]')?.content || null;

function freshState(h) {
  const ranks = h.ranks.length;
  const cols = [];
  const colOf = new Int32Array(h.experts);
  for (let r = 0; r < ranks; r++) cols.push([]);
  for (let e = 0; e < h.experts; e++) {
    const r = Math.min(h.owner[e], ranks - 1);
    colOf[e] = cols[r].length;
    cols[r].push(e);
  }
  return {
    cols, colOf,
    heat: cols.map((c) => new Float32Array(h.layers * c.length)),
    total: cols.map((c) => new Float32Array(h.layers * c.length)),
    totalMax: 1,
    drawn: new Array(ranks).fill(0),
    base: null,
    engine: null,
    frames: 0, dropped: 0, rejected: 0, lastSeq: -1, gapAfterFirst: false,
    decode: [], prefill: null,
    rtt: [], cache0: null, cache: null,
    offset: 0, delay: 0,
    packets: [], linkCalls: [],
  };
}

function connect() {
  if (rp) return;
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/telemetry");
  ws.onmessage = (ev) => {
    let f;
    try { f = JSON.parse(ev.data); } catch { if (live) live.rejected++; return; }
    if (!f || typeof f !== "object" || typeof f.t !== "string") { if (live) live.rejected++; return; }
    if (f.t === "hello") return onHello(f);
    if (f.t === "step") return onStep(f);
  };
  ws.onopen = () => setConn(true);
  ws.onclose = () => { if (rp) return; setConn(false); setTimeout(connect, 1000); };
}

function setConn(on) {
  $("dot").classList.toggle("on", on);
  $("conn").textContent = on ? "live" : "not connected; retrying";
}

function validHello(h) {
  const n = (v) => Number.isInteger(v) && v > 0 && v <= 4096;
  return h.schema === "tensorfold.live" && h.version === 0 && n(h.layers) && n(h.experts) && n(h.top_k) &&
    Array.isArray(h.ranks) && h.ranks.length >= 1 && h.ranks.length <= 8 &&
    Array.isArray(h.owner) && h.owner.length === h.experts && h.owner.every((o) => Number.isInteger(o) && o >= 0 && o < h.ranks.length);
}

function onHello(h) {
  if (!validHello(h)) { if (live) live.rejected++; return; }
  topo = h;
  live = freshState(h);
  live.offset = performance.now() - h.ms;
  $("model").textContent = `${h.model} · ${h.layers} layers × ${h.experts} experts, top ${h.top_k} · ${h.transport}`;
  $("thinkbox").hidden = !/qwen/i.test(h.model);
}

function validStep(f) {
  return Number.isInteger(f.seq) && Number.isInteger(f.n) && f.n > 0 && typeof f.ms === "number" &&
    Array.isArray(f.x) && f.x.length % 3 === 0 && Array.isArray(f.engine) && Array.isArray(f.layer_us);
}

function stepInRange(f, h) {
  for (let i = 0; i < f.x.length; i += 3) {
    const l = f.x[i], e = f.x[i + 1], c = f.x[i + 2];
    if (!(Number.isInteger(l) && l >= 0 && l < h.layers && Number.isInteger(e) && e >= 0 && e < h.experts && c > 0)) return false;
  }
  return f.engine.length === 2;
}

// `rateNow` is the clock for rates: real time when live, the recording's time when replaying.
function onStep(f, rateNow = performance.now()) {
  if (!topo || !validStep(f) || !stepInRange(f, topo)) { if (live) live.rejected++; return; }
  const ranks = topo.ranks.length;
  const byRank = new Array(ranks).fill(0);
  if (live.lastSeq >= 0 && f.seq !== live.lastSeq + 1) {
    live.dropped += f.seq - live.lastSeq - 1;
    live.gapAfterFirst = true;
  }
  live.lastSeq = f.seq;
  live.frames++;
  // One token lights its experts fully; a prefill chunk shades them by how often they ran.
  let peak = 1;
  if (f.n > 1) for (let i = 2; i < f.x.length; i += 3) peak = Math.max(peak, f.x[i]);
  for (let i = 0; i < f.x.length; i += 3) {
    const l = f.x[i], e = f.x[i + 1], c = f.x[i + 2];
    const r = Math.min(topo.owner[e], ranks - 1);
    const cell = l * live.cols[r].length + live.colOf[e];
    const v = f.n > 1 ? 0.35 + 0.65 * c / peak : 1;
    live.heat[r][cell] = Math.max(live.heat[r][cell], v);
    live.total[r][cell] += c;
    live.totalMax = Math.max(live.totalMax, live.total[r][cell]);
    byRank[r] += c;
  }
  for (let r = 0; r < ranks; r++) live.drawn[r] += byRank[r];
  if (live.base === null) {
    live.base = f.engine.map((v, r) => (v === null ? null : v - byRank[r]));
    live.cache0 = f.cache;
  }
  live.engine = f.engine;
  // The link's round trip over the last two seconds.
  live.rtt.push({ ms: f.ms, us: f.rtt_us, layers: f.rtt_layers });
  while (live.rtt.length > 2 && f.ms - live.rtt[1].ms > 2000) live.rtt.shift();
  live.cache = f.cache;
  live.delay = performance.now() - live.offset - f.ms;
  if (f.n === 1) {
    live.decode.push(f.ms);
    while (live.decode.length > 1 && f.ms - live.decode[0] > 3000) live.decode.shift();
  } else {
    live.prefill = { n: f.n, ms: f.step_us / 1000 };
  }
  if (ranks > 1 && byRank[1] > 0) {
    const now = performance.now();
    live.linkCalls.push({ t: rateNow, calls: byRank[1] });
    const dots = Math.min(byRank[1], f.n > 1 ? 24 : 8);
    for (let i = 0; i < dots; i++) live.packets.push({ t0: now + i * 12, lane: Math.random() });
  }
}

const canvas = $("canvas");
const ctx = canvas.getContext("2d");
let last = performance.now();

function draw(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (rp) advanceReplay(dt);
  if (!topo) {
    ctx.fillStyle = color("--muted");
    ctx.font = "14px system-ui, sans-serif";
    ctx.fillText(rp !== null ? "" : showcase ? "Loading the recording..." : "Waiting for the engine's live feed...", 20, 30);
    requestAnimationFrame(draw);
    return;
  }
  const ranks = topo.ranks.length;
  // Replays fade at the speed they play, and hold still while paused.
  const speed = rp ? (rp.playing ? rp.speed : 0) : 1;
  const decay = Math.exp(-dt * speed / 0.35);
  for (const h of live.heat) for (let i = 0; i < h.length; i++) h[i] *= decay;

  const pad = 20, gap = ranks > 1 ? Math.max(90, W * 0.12) : 0;
  const stacked = ranks > 1 && W < 640;
  const boxes = [];
  for (let r = 0; r < ranks; r++) {
    const w = stacked ? W - 2 * pad : (W - 2 * pad - gap * (ranks - 1)) / ranks;
    const h = stacked ? (H - 2 * pad - gap * (ranks - 1)) / ranks : H - 2 * pad;
    const x = stacked ? pad : pad + r * (w + gap);
    const y = stacked ? pad + r * (h + gap) : pad;
    boxes.push({ x, y, w, h });
  }
  const cellBg = color("--cell");
  for (let r = 0; r < ranks; r++) {
    const b = boxes[r];
    const rgb = color(r === 0 ? "--rank0" : "--rank1");
    const cols = live.cols[r].length || 1;
    ctx.fillStyle = color("--ink");
    ctx.font = "600 13px system-ui, sans-serif";
    ctx.fillText(`rank ${r} · ${topo.ranks[r]}`, b.x, b.y + 4);
    ctx.fillStyle = color("--muted");
    ctx.font = "12px system-ui, sans-serif";
    ctx.fillText(`${live.cols[r].length} experts per layer · ${live.drawn[r].toLocaleString()} calls`, b.x, b.y + 20);
    const top = b.y + 32, avail = b.h - 40;
    const cell = Math.max(1, Math.min(b.w / cols, avail / topo.layers));
    const gw = cell * cols, gh = cell * topo.layers;
    const ox = b.x + (b.w - gw) / 2, oy = top + (avail - gh) / 2;
    b.grid = { ox, oy, gw, gh };
    const inset = cell >= 6 ? 1 : 0;
    const heat = live.heat[r], total = live.total[r];
    for (let l = 0; l < topo.layers; l++) {
      for (let c = 0; c < live.cols[r].length; c++) {
        const i = l * live.cols[r].length + c;
        const base = total[i] > 0 ? 0.08 + 0.22 * Math.sqrt(total[i] / live.totalMax) : 0;
        const a = Math.max(heat[i], base);
        const cx = ox + c * cell + inset, cy = oy + l * cell + inset, cw = cell - 2 * inset;
        ctx.fillStyle = cellBg;
        ctx.fillRect(cx, cy, cw, cw);
        if (a > 0.01) {
          ctx.fillStyle = `rgba(${rgb}, ${a.toFixed(3)})`;
          ctx.fillRect(cx, cy, cw, cw);
        }
      }
    }
    ctx.fillStyle = color("--muted");
    ctx.font = "11px system-ui, sans-serif";
    if (cell >= 4) {
      ctx.save();
      ctx.translate(ox - 6, oy + gh / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = "center";
      ctx.fillText("layer", 0, 0);
      ctx.restore();
    }
  }
  if (ranks > 1) drawLink(boxes[0], boxes[1], stacked, now, rp ? rp.clock : now);
  requestAnimationFrame(draw);
}

function drawLink(a, b, stacked, now, rateNow) {
  const x0 = stacked ? a.x + a.w / 2 : a.grid.ox + a.grid.gw + 6;
  const y0 = stacked ? a.grid.oy + a.grid.gh + 6 : a.grid.oy + a.grid.gh / 2;
  const x1 = stacked ? x0 : b.grid.ox - 6;
  const y1 = stacked ? b.grid.oy - 6 : y0;
  ctx.strokeStyle = color("--line");
  ctx.lineWidth = 8;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
  // A dot rides out with each dispatch and back with its combine.
  const flight = 420;
  live.packets = live.packets.filter((p) => now - p.t0 < flight);
  for (const p of live.packets) {
    const t = (now - p.t0) / flight;
    if (t < 0) continue;
    const out = t < 0.5;
    const u = out ? t * 2 : 2 - t * 2;
    const off = (p.lane - 0.5) * 6;
    const x = x0 + (x1 - x0) * u + (stacked ? off : 0);
    const y = y0 + (y1 - y0) * u + (stacked ? 0 : off);
    ctx.fillStyle = `rgba(${color(out ? "--rank0" : "--rank1")}, 0.9)`;
    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  live.linkCalls = live.linkCalls.filter((c) => rateNow - c.t < 1000);
  const callsPerS = live.linkCalls.reduce((s, c) => s + c.calls, 0);
  const pk = callsPerS * topo.chunks * 2;
  const r0 = live.rtt[0], r1 = live.rtt[live.rtt.length - 1];
  const rtt = r0 && r1.layers > r0.layers ? (r1.us - r0.us) / (r1.layers - r0.layers) : null;
  ctx.fillStyle = color("--muted");
  ctx.font = "12px system-ui, sans-serif";
  ctx.textAlign = "center";
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  ctx.fillText(topo.transport, mx + (stacked ? 70 : 0), my - (stacked ? 0 : 18));
  ctx.fillText(`${Math.round(pk).toLocaleString()} packets/s`, mx + (stacked ? 70 : 0), my + (stacked ? 14 : 22));
  if (rtt !== null) ctx.fillText(`${rtt.toFixed(0)} µs per layer`, mx + (stacked ? 70 : 0), my + (stacked ? 28 : 36));
  ctx.textAlign = "left";
}

function stat(k, v, s, cls) {
  return `<div class="stat"><div class="k">${k}</div><div class="v ${cls || ""}">${v}</div><div class="s">${s || ""}</div></div>`;
}

function renderStats() {
  if (!live) { $("stats").innerHTML = ""; return; }
  const d = live.decode;
  const tps = d.length > 1 ? (d.length - 1) / ((d[d.length - 1] - d[0]) / 1000) : 0;
  const out = [];
  out.push(stat("decode", tps ? `${tps.toFixed(1)} tokens/s` : "idle", live.prefill ? `last prefill: ${live.prefill.n} tokens in ${live.prefill.ms.toFixed(0)} ms` : "no prefill yet"));
  for (let r = 0; r < topo.ranks.length; r++) {
    const eng = live.engine && live.base && live.engine[r] !== null && live.base[r] !== null ? live.engine[r] - live.base[r] : null;
    let line, cls = "";
    if (eng === null) line = "the engine keeps no count of its own here";
    else if (live.gapAfterFirst) line = `engine counted ${eng.toLocaleString()}; frames were dropped, so no comparison`;
    else if (eng === live.drawn[r]) { line = `matches the engine's own count`; cls = "good"; }
    else { line = `engine counted ${eng.toLocaleString()}`; cls = "warn"; }
    out.push(stat(`rank ${r} expert calls`, live.drawn[r].toLocaleString(), line, cls));
  }
  if (live.cache && live.cache0) {
    const c = live.cache, c0 = live.cache0;
    const calls = (c.resident + c.hinted + c.late + c.missed) - (c0.resident + c0.hinted + c0.late + c0.missed);
    const hits = (c.resident + c.hinted) - (c0.resident + c0.hinted);
    out.push(stat("expert cache (rank 0)", calls ? `${(100 * hits / calls).toFixed(1)}% hits` : "no calls yet",
      `${(c.missed - c0.missed).toLocaleString()} misses, ${(c.late - c0.late).toLocaleString()} late, ${(c.loads - c0.loads).toLocaleString()} loads`));
  }
  if (rp) {
    out.push(stat("recording", `${live.frames.toLocaleString()} of ${rp.steps.toLocaleString()} steps`,
      `${live.dropped} dropped while recording · ${rp.rejected + live.rejected} lines rejected${rp.truncated ? " · file ends mid-line" : ""}`,
      live.dropped || rp.rejected || live.rejected ? "warn" : ""));
    $("clock").textContent = `${(rp.clock / 1000).toFixed(1)} / ${(rp.duration / 1000).toFixed(1)} s`;
    if (!rp.dragging) $("scrub").value = rp.duration ? Math.round(1000 * rp.clock / rp.duration) : 0;
  } else {
    out.push(stat("live feed", `${live.frames.toLocaleString()} frames`,
      `${live.dropped} dropped · ${live.rejected} rejected · ${Math.max(0, live.delay).toFixed(0)} ms behind`, live.dropped || live.rejected ? "warn" : ""));
  }
  $("stats").innerHTML = out.join("");
}

// Chat
const history = [];
let busy = null;

function addMsg(role, text) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}

// An assistant reply that fills in as text arrives, with its reasoning folded apart.
function makeReply() {
  const el = addMsg("assistant", "");
  const think = document.createElement("details");
  think.className = "think";
  think.open = true;
  think.innerHTML = "<summary>thinking</summary>";
  const thinkText = document.createElement("div");
  think.appendChild(thinkText);
  const body = document.createElement("div");
  el.appendChild(body);
  const foot = document.createElement("div");
  foot.className = "foot";
  el.appendChild(foot);
  const r = {
    el, body, foot, content: "", reasoning: "",
    add(channel, text) {
      if (channel === "reasoning") {
        r.reasoning += text;
        if (!think.parentNode) el.insertBefore(think, body);
        thinkText.textContent = r.reasoning;
      } else {
        r.content += text;
        body.textContent = r.content;
        if (think.parentNode && think.open && r.content.trim()) think.open = false;
      }
      $("log").scrollTop = $("log").scrollHeight;
    },
    footer(s, finish) {
      foot.textContent = `${s.completion_tokens ?? "?"} tokens · first token ${Number(s.ttft_ms).toFixed(0)} ms · ${Number(s.decode_tokens_per_s).toFixed(1)} tokens/s` +
        (s.cached_tokens ? ` · ${s.cached_tokens} prompt tokens reused` : "") + (finish && finish !== "stop" ? ` · stopped: ${finish}` : "");
    },
  };
  return r;
}

async function send(text) {
  history.push({ role: "user", content: text });
  addMsg("user", text);
  const reply = makeReply();
  const { el, body, foot } = reply;
  let extra = null, finish = null;
  busy = new AbortController();
  setBusy(true);
  const req = {
    messages: history,
    stream: true,
    stream_options: { include_usage: true },
    max_tokens: Math.max(1, parseInt($("max").value, 10) || 512),
    temperature: Math.max(0, parseFloat($("temp").value) || 0),
  };
  if (!$("thinkbox").hidden) req.chat_template_kwargs = { enable_thinking: $("think").checked };
  try {
    const res = await fetch("/v1/chat/completions", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(req), signal: busy.signal,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => null);
      throw new Error(err?.error?.message || `HTTP ${res.status}`);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line.startsWith("data: ") || line === "data: [DONE]") continue;
        const chunk = JSON.parse(line.slice(6));
        if (chunk.error) throw new Error(chunk.error.message);
        const ch = chunk.choices?.[0];
        if (ch) {
          if (ch.delta?.reasoning_content) reply.add("reasoning", ch.delta.reasoning_content);
          if (ch.delta?.content) reply.add("content", ch.delta.content);
          if (ch.finish_reason) finish = ch.finish_reason;
        }
        if (chunk.tensorfold) extra = { ...chunk.tensorfold, completion_tokens: chunk.usage?.completion_tokens };
      }
    }
    const { content, reasoning } = reply;
    history.push({ role: "assistant", content, ...(reasoning ? { reasoning_content: reasoning } : {}) });
    if (extra) reply.footer(extra, finish);
  } catch (e) {
    if (e.name === "AbortError") {
      history.push({ role: "assistant", content: reply.content });
      foot.textContent = "stopped";
    } else {
      history.pop();
      el.classList.add("error");
      body.textContent = (reply.content ? reply.content + "\n" : "") + "Error: " + e.message;
    }
  } finally {
    busy = null;
    setBusy(false);
  }
}

function setBusy(on) {
  $("send").textContent = on ? "Stop" : "Send";
  $("send").classList.toggle("stop", on);
}

$("form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  if (busy) { busy.abort(); return; }
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  send(text);
});
$("input").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
    ev.preventDefault();
    $("form").requestSubmit();
  }
});

// Replay (TASK-16): a recording is the live feed's frames, one per line, with the chat's notes among them.
async function readText(blob) {
  const head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
  if (head[0] === 0x1f && head[1] === 0x8b) {
    return await new Response(blob.stream().pipeThrough(new DecompressionStream("gzip"))).text();
  }
  return await blob.text();
}

function parseTrace(text) {
  const lines = text.split("\n");
  while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
  if (!lines.length) throw new Error("the file is empty");
  let hello;
  try { hello = JSON.parse(lines[0]); } catch { throw new Error("its first line is not JSON"); }
  if (!hello || hello.t !== "hello" || !validHello(hello)) throw new Error("it does not start with a TensorFold hello line");
  const items = [];
  let rejected = 0, truncated = false, steps = 0;
  for (let i = 1; i < lines.length; i++) {
    let v;
    try { v = JSON.parse(lines[i]); } catch {
      if (i === lines.length - 1) truncated = true; else rejected++;
      continue;
    }
    if (!v || typeof v !== "object") { rejected++; continue; }
    if (v.t === "step") {
      if (!validStep(v) || !stepInRange(v, hello) || !(typeof v.step_us === "number" && v.step_us >= 0)) { rejected++; continue; }
      steps++;
      items.push({ step: true, v });
    } else if (["chat", "text", "done", "end"].includes(v.t)) {
      if (v.t === "chat" && !(Array.isArray(v.messages) && v.messages.every((m) => m && typeof m.content === "string"))) { rejected++; continue; }
      if (v.t === "text" && typeof v.s !== "string") { rejected++; continue; }
      items.push({ step: false, v });
    }
  }
  if (!steps) throw new Error("it holds no engine steps");
  // Recording time, with idle stretches between requests cut to a second.
  let t = 0, prevEnd = null;
  for (const it of items) {
    if (!it.step) continue;
    const dur = it.v.step_us / 1000, start = it.v.ms - dur;
    const gap = prevEnd === null ? 0 : start - prevEnd;
    it.start = (prevEnd === null ? 0 : t) + (gap > 1500 ? 1000 : Math.max(0, gap));
    it.t = it.start + dur;
    t = it.t;
    prevEnd = it.v.ms;
  }
  // A request appears as its prefill starts; other notes right after the step before them.
  let next = t;
  for (let i = items.length - 1; i >= 0; i--) {
    if (items[i].step) next = items[i].start;
    else if (items[i].v.t === "chat") items[i].t = next;
  }
  let last = 0;
  for (const it of items) {
    if (it.t === undefined) it.t = last;
    last = it.t = Math.max(it.t, last);
  }
  return { hello, items, steps, rejected, truncated, duration: last, chats: items.some((it) => it.v.t === "chat") };
}

async function loadTrace(name, blob) {
  let trace;
  try {
    trace = parseTrace(await readText(blob));
  } catch (e) {
    showProblem(`${name} is not a TensorFold recording: ${e.message}.`);
    return;
  }
  startReplay(name, trace, null);
}

// The public site's list of recordings, each with a label saying where and how it was recorded.
async function startShowcase() {
  document.querySelector("header h1").textContent = "TensorFold-Swarm";
  $("form").hidden = true;
  $("dot").hidden = true;
  $("conn").textContent = "loading the recording";
  $("empty").textContent = "Loading the recording...";
  for (const id of ["badge", "inspector", "repo"]) {
    $(id).hidden = false;
  }
  let list;
  try {
    const res = await fetch(showcase);
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    list = (await res.json()).recordings;
    if (!Array.isArray(list) || !list.length || !list.every((r) => r && typeof r.file === "string" && typeof r.title === "string")) {
      throw new Error("it lists no recordings");
    }
  } catch (e) {
    showProblem(`Could not load the list of recordings: ${e.message}.`);
    return;
  }
  const pick = $("pick");
  list.forEach((rec, i) => {
    const o = document.createElement("option");
    o.value = String(i);
    o.textContent = rec.title;
    pick.appendChild(o);
  });
  pick.hidden = false;
  const want = new URLSearchParams(location.search).get("r");
  const at = Math.max(0, list.findIndex((rec) => rec.id === want));
  pick.value = String(at);
  pick.addEventListener("change", () => openRecording(list[Number(pick.value)], true));
  openRecording(list[at], false);
}

let opening = 0;
async function openRecording(rec, chosen) {
  const ticket = ++opening;
  if (chosen && rec.id) {
    window.history.replaceState(null, "", `?r=${encodeURIComponent(rec.id)}`);
  }
  let trace;
  try {
    const res = await fetch(rec.file);
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    trace = parseTrace(await readText(await res.blob()));
  } catch (e) {
    if (ticket === opening) {
      showProblem(`Could not replay "${rec.title}": ${e.message}.`);
    }
    return;
  }
  if (ticket === opening) {
    startReplay(rec.file.split("/").pop(), trace, rec);
  }
}

function addLabel(label) {
  const el = addMsg("note", label.summary ? label.summary + " " : "");
  if (label.results) {
    const a = document.createElement("a");
    a.href = label.results;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "Raw results and how it was recorded";
    el.appendChild(a);
  }
}

function showProblem(text) {
  $("empty")?.remove();
  const el = addMsg("note error", text);
  el.classList.add("error");
}

// `label` describes a recording from the public site's list, and may name its machines more plainly than the file does.
function startReplay(name, trace, label) {
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  if (label && [...$("speed").options].some((o) => o.value === String(label.speed)))
  {
    $("speed").value = String(label.speed);
  }
  rp = { ...trace, name, label, i: 0, clock: 0, speed: parseFloat($("speed").value) || 1, playing: true, dragging: false, reply: null, shown: 0 };
  const ranks = label && Array.isArray(label.ranks) && label.ranks.length === trace.hello.ranks.length ? label.ranks : trace.hello.ranks;
  topo = { ...trace.hello, ranks };
  $("dot").classList.remove("on");
  const date = trace.hello.recorded ? new Date(trace.hello.recorded * 1000) : null;
  if (label) {
    const day = date ? ` on ${date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" })}` : "";
    $("conn").textContent = `recorded${day}, replayed in your browser with no engine connected`;
  } else {
    $("conn").textContent = `replaying ${name}, recorded${date ? ` on ${date.toLocaleString()}` : ""}`;
  }
  $("model").textContent = `${topo.model} · ${topo.layers} layers × ${topo.experts} experts, top ${topo.top_k} · ${topo.transport}`;
  $("form").hidden = true;
  $("player").hidden = false;
  $("golive").hidden = showcase !== null || !/^https?:$/.test(location.protocol) || new URLSearchParams(location.search).has("trace");
  seekReplay(0);
  $("play").textContent = "Pause";
}

function resetReplayChat() {
  $("log").innerHTML = "";
  rp.reply = null;
  rp.shown = 0;
  if (rp.label)
  {
    addLabel(rp.label);
  }
  if (!rp.chats) addMsg("note", `This recording has no chat: ${rp.steps.toLocaleString()} engine steps of a ${topo.transport} run.`);
}

function applyItem(it) {
  if (it.step) return onStep(it.v, it.t);
  const n = it.v;
  if (n.t === "chat") {
    // Each request carries the whole conversation; show what is new.
    for (const m of n.messages.slice(rp.shown)) {
      if (m.role === "assistant") addMsg("assistant", m.content);
      else addMsg("user", (m.role === "system" ? "System: " : "") + m.content);
    }
    rp.shown = n.messages.length + 1;
    rp.reply = makeReply();
  } else if (n.t === "text" && rp.reply) {
    rp.reply.add(n.channel === "reasoning" ? "reasoning" : "content", n.s);
  } else if (n.t === "done" && rp.reply) {
    if (n.finish === "client_gone") rp.reply.foot.textContent = "the client stopped this reply";
    else rp.reply.footer(n, n.finish);
    rp.reply = null;
  }
}

function seekReplay(t) {
  live = freshState(topo);
  resetReplayChat();
  rp.i = 0;
  rp.clock = Math.max(0, Math.min(t, rp.duration));
  while (rp.i < rp.items.length && rp.items[rp.i].t <= rp.clock) applyItem(rp.items[rp.i++]);
  for (const h of live.heat) h.fill(0);
  live.packets = [];
}

function advanceReplay(dt) {
  if (!rp.playing || rp.dragging) return;
  rp.clock += dt * 1000 * rp.speed;
  while (rp.i < rp.items.length && rp.items[rp.i].t <= rp.clock) applyItem(rp.items[rp.i++]);
  if (rp.clock >= rp.duration) {
    rp.clock = rp.duration;
    rp.playing = false;
    $("play").textContent = "Replay";
  }
}

$("play").addEventListener("click", () => {
  if (!rp) return;
  if (!rp.playing && rp.clock >= rp.duration) seekReplay(0);
  rp.playing = !rp.playing;
  $("play").textContent = rp.playing ? "Pause" : "Play";
});
$("speed").addEventListener("change", () => { if (rp) rp.speed = parseFloat($("speed").value) || 1; });
$("scrub").addEventListener("input", () => {
  if (!rp) return;
  rp.dragging = true;
  seekReplay(rp.duration * $("scrub").value / 1000);
  renderStats();
});
$("scrub").addEventListener("change", () => { if (rp) rp.dragging = false; });
$("file").addEventListener("change", () => {
  const f = $("file").files[0];
  if (f) loadTrace(f.name, f);
  $("file").value = "";
});
$("golive").addEventListener("click", () => { location.href = location.pathname; });
addEventListener("dragover", (ev) => { ev.preventDefault(); document.body.classList.add("dragging"); });
addEventListener("dragleave", (ev) => { if (!ev.relatedTarget) document.body.classList.remove("dragging"); });
addEventListener("drop", (ev) => {
  ev.preventDefault();
  document.body.classList.remove("dragging");
  const f = ev.dataTransfer?.files?.[0];
  if (f) loadTrace(f.name, f);
});

const traceUrl = new URLSearchParams(location.search).get("trace");
if (traceUrl) {
  fetch(traceUrl).then((r) => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.blob();
  }).then((b) => loadTrace(traceUrl.split("/").pop(), b)).catch((e) => showProblem(`Could not load ${traceUrl}: ${e.message}.`));
} else if (showcase) {
  startShowcase();
} else if (/^https?:$/.test(location.protocol)) {
  connect();
}
requestAnimationFrame(draw);
setInterval(renderStats, 250);
</script>
